topic: bash
questions:
  bash-redir-001:
    prompt: מה עושה `./deploy.sh > out.log 2>&1`?
    options:
      - "שולח גם את הפלט הרגיל (stdout) וגם את השגיאות (stderr) לקובץ out.log"
      - "שולח את stdout ל-out.log, ואת stderr לקובץ בשם 1"
      - "שולח רק את השגיאות ל-out.log"
      - "מוסיף את stdout לסוף out.log"
    explanation: |
      `>` שולח את הפלט הרגיל (stdout, מספר 1) לקובץ. `2>&1` אומר: "שלח את השגיאות (stderr, מספר 2) לאותו מקום שאליו הולך הפלט הרגיל".
      הסדר חשוב: ב-`2>&1 > out.log` השגיאות נשארות בטרמינל.
      `>>` מוסיף לסוף הקובץ, ו-`&>` הוא קיצור של bash לשניהם.

  bash-redir-002:
    prompt: מה זה stdin, stdout ו-stderr, ומה עושה pipe (`|`)?
    keyPoints:
      - "יש שלושה ערוצים קבועים: stdin (0, קלט), stdout (1, פלט רגיל), stderr (2, שגיאות)"
      - "pipe מעביר את הפלט הרגיל של פקודה אחת לקלט של הפקודה הבאה"
      - "שגיאות לא עוברות ב-pipe, אלא אם מוסיפים 2>&1 (או |&)"
      - "כך משלבים כלים קטנים לפעולה אחת גדולה (הגישה של Unix)"
    modelAnswer: |
      לכל תהליך יש שלושה ערוצים פתוחים מההתחלה:
      - **stdin** (מספר 0): משם הוא קורא קלט.
      - **stdout** (מספר 1): לשם הוא כותב פלט רגיל.
      - **stderr** (מספר 2): לשם הוא כותב שגיאות.
      הם נפרדים כדי שאפשר יהיה, למשל, לשמור את הפלט בקובץ ועדיין לראות שגיאות על המסך.
      pipe, כמו `cmd1 | cmd2`, מעביר את הפלט של cmd1 לקלט של cmd2. כך מחברים כלים קטנים: `grep ERROR app.log | sort | uniq -c`.
      רק stdout עובר ב-pipe. השגיאות ממשיכות לטרמינל, אלא אם מוסיפים `2>&1`.
    explanation: "`/dev/null` הוא \"פח\" שזורק כל מה שנכתב אליו. `cmd > /dev/null 2>&1` משתיק הכול."

  bash-redir-003:
    prompt: הריצו את `./backup.sh`, והוסיפו את הפלט הרגיל ואת השגיאות לסוף הקובץ `/var/log/backup.log`.
    explanation: "`>>` מוסיף לסוף הקובץ במקום לדרוס אותו. `2>&1` חייב לבוא **אחרי** ההפניה לקובץ. זו בדיוק השורה ששמים ב-crontab."

  bash-redir-004:
    prompt: מה ההבדל בין `echo hi > notes.txt` לבין `echo hi >> notes.txt`?
    options:
      - "`>` דורס את הקובץ; `>>` מוסיף לסוף שלו"
      - "`>` מוסיף לסוף; `>>` דורס"
      - "`>>` כותב לערוץ השגיאות"
      - "אין הבדל"
    explanation: "שניהם יוצרים את הקובץ אם הוא לא קיים. `>` מרוקן אותו קודם, וזו דרך קלאסית למחוק קובץ הגדרות בטעות. `set -o noclobber` גורם ל-`>` לסרב לדרוס קובץ קיים."

  bash-redir-005:
    prompt: הריצו את `./noisy.sh` וזרקו את כל הפלט שלו, גם הרגיל וגם השגיאות.
    explanation: "`/dev/null` זורק כל מה שנכתב אליו. `2>&1` חייב לבוא אחרי `> /dev/null`, אחרת השגיאות עדיין יגיעו לטרמינל."

  bash-redir-006:
    prompt: ב-`make build && ./deploy.sh`, מתי `./deploy.sh` ירוץ?
    options:
      - "רק אם `make build` הצליח (קוד יציאה 0)"
      - "רק אם `make build` נכשל"
      - "תמיד, אחרי ש-`make build` מסתיים"
      - "במקביל ל-`make build`"
    explanation: |
      `&&` מריץ את הפקודה הבאה רק אם הקודמת הצליחה. `||` רק אם היא נכשלה. `;` תמיד.
      דפוס נפוץ: `cmd || echo "failed"`. `&` בודד מריץ את הפקודה ברקע.

  bash-script-001:
    prompt: מה עושה `set -euo pipefail` בתחילת סקריפט bash, ולמה כדאי להשתמש בזה?
    keyPoints:
      - "-e: הסקריפט עוצר מיד כשפקודה נכשלת (קוד יציאה שאינו 0)"
      - "-u: שימוש במשתנה שלא הוגדר נחשב לשגיאה"
      - "-o pipefail: שרשרת של pipe נכשלת אם אחת הפקודות בה נכשלה, לא רק האחרונה"
      - "הסקריפט נכשל מהר וברור, במקום להמשיך במצב שבור (למשל rm -rf $DIR/ כש-DIR ריק)"
    modelAnswer: |
      זה נקרא "strict mode", והוא משנה שלושה דברים:
      - `-e`: הסקריפט עוצר ברגע שפקודה נכשלת, במקום להמשיך.
      - `-u`: משתנה שלא הוגדר הוא שגיאה. זה מציל ממקרים כמו `rm -rf "$BUILD_DIR/"`, שכשהמשתנה ריק מוחק מהתיקייה הראשית.
      - `-o pipefail`: בלי זה, רק הפקודה האחרונה ב-pipe קובעת אם הוא הצליח. כך `curl ... | jq` ייראה מוצלח גם כש-curl נכשל.
      ביחד, סקריפטים של CI ופריסה נכשלים מהר ובצורה ברורה, ולא "מצליחים בחצי".
      אפשר להוסיף `trap` לניקוי בסוף, ו-`-x` כשמחפשים באג.
    explanation: "ל-`-e` יש חריגים: פקודה בתוך תנאי `if`, או לפני `||` או `&&`, לא עוצרת את הסקריפט. ובכל זאת זו ברירת מחדל טובה."

  bash-script-002:
    prompt: איך בודקים ב-bash אם הפקודה האחרונה הצליחה, ואיזה ערך אומר הצלחה?
    options: ["`$?`; 0 אומר הצלחה", "`$!`; 1 אומר הצלחה", "`$#`; 0 אומר הצלחה", "`$0`; כל ערך שאינו 0 אומר הצלחה"]
    explanation: |
      קוד יציאה 0 = הצלחה. כל מספר אחר = כישלון.
      `$?` = קוד היציאה של הפקודה האחרונה. `$!` = ה-PID של המשימה האחרונה ברקע. `$#` = מספר הארגומנטים. `$0` = שם הסקריפט. `$@` = כל הארגומנטים.

  bash-script-003:
    prompt: למה לכתוב `"$file"` (עם מירכאות) ולא `$file`?
    options:
      - "בלי מירכאות, bash מפרק את הערך במקומות של רווחים ומפענח תווים כמו *, ולכן שמות קבצים עם רווח שוברים את הפקודה"
      - "מירכאות הופכות את המשתנה לקריא בלבד"
      - "מירכאות נחוצות רק למספרים"
      - "אין הבדל"
    explanation: |
      אם `file="my report.txt"`, אז `rm $file` ינסה למחוק שני קבצים: `my` ו-`report.txt`.
      תמיד שמים מירכאות: `"$var"` ו-`"$@"`. הכלי ShellCheck מוצא את הטעות הזאת.

  bash-script-004:
    prompt: תארו סקריפט bash שבודק אם רשימה של שרתים עונה על פורט 443, ומדפיס אילו מהם לא עונים. במה הייתם משתמשים?
    keyPoints:
      - "לולאה על השרתים (for על רשימה, או while read מקובץ)"
      - "בדיקת הפורט עם nc -z, curl, או timeout עם /dev/tcp, תמיד עם הגבלת זמן"
      - "שימוש בקוד היציאה בתוך if כדי להחליט אם השרת עונה"
      - "מירכאות סביב משתנים, set -u ו-pipefail, ויציאה עם קוד שאינו 0 אם שרת כלשהו לא עונה (חשוב ל-cron ול-CI)"
    modelAnswer: |
      קוראים את רשימת השרתים מקובץ ועוברים עליה בלולאה: `while read -r host; do ... done < hosts.txt`.
      לכל שרת בודקים את הפורט עם הגבלת זמן קצרה:
      `if nc -z -w 3 "$host" 443; then echo "$host up"; else echo "$host DOWN"; failed=1; fi`
      אם אין `nc`, אפשר `timeout 3 bash -c "</dev/tcp/$host/443"`.
      בתחילת הסקריפט שמים strict mode, ומירכאות סביב כל משתנה. בסוף `exit $failed`, כדי ש-cron או CI יוכלו להתריע כשמשהו לא עונה.
      אם יש הרבה שרתים, מריצים את הבדיקות במקביל עם `&` ו-`wait`, או עם `xargs -P`.
    explanation: המראיינים רוצים לראות שימוש בקודי יציאה ובהגבלת זמן, ומחשבה על מי יריץ את הסקריפט (cron או CI).

  bash-script-005:
    prompt: מה ההבדל בין `source script.sh` לבין `./script.sh`?
    options:
      - "source מריץ את הסקריפט ב-shell הנוכחי (משתנים ו-cd נשארים); ./ מריץ אותו בתהליך חדש"
      - "source מקמפל את הסקריפט קודם"
      - "./ דורש root"
      - "אין הבדל"
    explanation: |
      לכן מריצים `source venv/bin/activate` או `source ~/.bashrc`: הם צריכים לשנות את ה-shell שבו אתם נמצאים.
      `./script.sh` רץ בתהליך נפרד, כך שהשינויים שלו נעלמים כשהוא מסתיים. הוא צריך הרשאת הרצה ו-shebang.

  bash-script-006:
    prompt: מה עושה השורה הראשונה `#!/bin/bash` בסקריפט?
    options:
      - "זה ה-shebang: הוא אומר למערכת איזו תוכנה מריצה את הסקריפט כשמריצים `./script.sh`"
      - "זו הערה שלא משפיעה על כלום"
      - "היא גורמת לסקריפט לרוץ כ-root"
      - "היא טוענת פונקציות של bash מ-/bin"
    explanation: "בלי shebang הסקריפט ירוץ עם ה-shell שהפעיל אותו, וזה לא תמיד bash. `#!/usr/bin/env bash` מחפש את bash ב-PATH, וזה עובד על יותר מערכות. עדיין צריך `chmod +x`."

  bash-script-007:
    prompt: 'למה `NAME = "dana"` נכשל ב-bash עם השגיאה `NAME: command not found`?'
    options:
      - "אסור רווחים סביב `=` בהגדרת משתנה; bash חושב ש-NAME היא פקודה"
      - "שמות משתנים חייבים להיות באותיות קטנות"
      - "מחרוזות צריכות מירכאות בודדות"
      - "צריך לכתוב `set NAME`"
    explanation: |
      כותבים `NAME="dana"`, בלי רווחים. קוראים את הערך עם `$NAME` או `"${NAME}"`.
      בבדיקות בתוך `[ ]` זה הפוך: חייבים רווחים, למשל `[ "$a" = "$b" ]`.

  bash-script-008:
    prompt: הגדירו את המשתנה `ENV` לערך `prod`, כך שתוכניות שתפעילו מה-shell הזה יראו אותו.
    explanation: |
      בלי `export`, המשתנה קיים רק ב-shell הנוכחי, ותוכניות שתפעילו ממנו (סקריפטים, אפליקציות) לא יקבלו אותו.
      `env` או `printenv ENV` מראים מה הוגדר. לפקודה אחת בלבד: `ENV=prod ./app`.

  bash-script-009:
    prompt: מריצים סקריפט כך `./deploy.sh staging v2`. מה הערכים של `$1` ו-`$#` בתוכו?
    options:
      - "`$1` הוא `staging`, ו-`$#` הוא 2"
      - "`$1` הוא `./deploy.sh`, ו-`$#` הוא 3"
      - "`$1` הוא `v2`, ו-`$#` הוא 2"
      - "`$1` הוא `staging`, ו-`$#` הוא ה-PID"
    explanation: |
      `$0` הוא שם הסקריפט. `$1`, `$2` וכן הלאה הם הארגומנטים. `$#` הוא כמה ארגומנטים יש. `"$@"` הוא כולם, כל אחד בנפרד.
      כדאי לבדוק אותם בהתחלה:
      `[ $# -eq 2 ] || { echo "usage: $0 env version"; exit 1; }`

  bash-script-010:
    prompt: סקריפט bash נכשל, ואתם לא יודעים איפה. איך מוצאים את הבעיה?
    keyPoints:
      - "מריצים עם bash -x (או set -x), שמדפיס כל פקודה לפני שהיא רצה"
      - "בודקים קודי יציאה ($?) וקוראים את השגיאות; מוסיפים set -euo pipefail כדי שהסקריפט יעצור בדיוק במקום הכישלון"
      - "מדפיסים משתנים בנקודות חשובות, או מריצים ידנית את החלק שנכשל"
      - "מריצים ShellCheck כדי למצוא טעויות במירכאות ובתחביר"
      - "אם זה נכשל רק במקום אחר (cron, CI), משווים את הסביבה: PATH, משתמש, תיקיית עבודה"
    modelAnswer: |
      קודם מריצים `bash -x script.sh`, או שמים `set -x` סביב החלק החשוד. כך כל פקודה מודפסת עם הערכים האמיתיים של המשתנים, ורואים בדיוק איזו שורה נכשלת.
      מוודאים שיש `set -euo pipefail`, כדי שהסקריפט יעצור במקום שבו הבעיה קרתה ולא מאוחר יותר. קוראים את השגיאות ובודקים את קוד היציאה (`echo $?`).
      אחר כך מדפיסים את המשתנים החשובים, או מעתיקים את הפקודה שנכשלה ומריצים אותה ידנית.
      ShellCheck מוצא מירכאות חסרות וטעויות נפוצות אחרות.
      אם זה נכשל רק ב-cron או ב-CI, משווים את הסביבה: PATH, המשתמש ותיקיית העבודה.
    explanation: "`PS4='+ ${LINENO}: '` לפני `set -x` מוסיף מספרי שורות להדפסה."

  bash-text-001:
    prompt: חפשו בכל הקבצים בתיקייה `/etc/nginx` שורות שמכילות `server_name`, בלי הבדל בין אותיות גדולות לקטנות, והציגו מספרי שורות.
    explanation: |
      `-r` מחפש בכל הקבצים שבתיקייה, `-i` מתעלם מגודל אותיות, ו-`-n` מציג מספרי שורות.
      עוד שימושיים: `-v` (השורות שלא מתאימות), `-c` (ספירה), `-l` (רק שמות קבצים), `-E` (ביטויים מורחבים), `-A`/`-B`/`-C N` (שורות לפני ואחרי).

  bash-text-002:
    prompt: ב-`access.log` כתובת ה-IP של הלקוח היא השדה הראשון. הדפיסו את 5 כתובות ה-IP ששלחו הכי הרבה בקשות, עם מספר הבקשות.
    explanation: |
      זו השרשרת הקלאסית:
      1. שולפים את השדה (`awk '{print $1}'`).
      2. ממיינים (`sort`). חובה, כי `uniq` מאחד רק שורות זהות **שנמצאות אחת אחרי השנייה**.
      3. סופרים (`uniq -c`).
      4. ממיינים לפי המספר, מהגדול לקטן (`sort -rn`).
      5. לוקחים את הראשונים (`head`).
      מראיינים אוהבים את השאלה הזאת.

  bash-text-003:
    prompt: החליפו כל מופע של `localhost` ב-`db.internal` בקובץ `config.ini`, ושמרו את השינוי בקובץ עצמו.
    explanation: |
      `s/old/new/g`: ה-`g` אומר להחליף את כל המופעים בכל שורה. בלעדיו רק הראשון בכל שורה מוחלף.
      `-i` עורך את הקובץ עצמו, ו-`-i.bak` שומר גם עותק גיבוי. ב-macOS צריך לכתוב `-i ''`.

  bash-text-004:
    prompt: מה הכי מתאים כדי להדפיס את העמודה השלישית בקובץ שהעמודות שלו מופרדות ברווחים?
    options: ["awk '{print $3}' file", "grep -3 file", "sed -n 3p file", "head -3 file"]
    explanation: |
      awk מפרק כל שורה לשדות: `$1`, `$2` וכן הלאה, ו-`$NF` הוא השדה האחרון.
      `sed -n 3p` מדפיס את **השורה** השלישית, ו-`head -3` את שלוש השורות הראשונות.
      כשהמפריד הוא תו קבוע, `cut -d, -f3` עובד גם כן.

  bash-text-005:
    prompt: עקבו אחרי `app.log` בזמן אמת, והציגו רק שורות שמכילות `ERROR`.
    explanation: "`tail -f` ממשיך להציג שורות חדשות. `-F` ממשיך גם אחרי שהלוג מוחלף בסבב לוגים. אם שולחים את הפלט של grep לפקודה נוספת, מוסיפים `--line-buffered` כדי שהשורות לא יחכו בזיכרון."

  bash-text-006:
    prompt: מצאו את כל קובצי ה-`.log` תחת `/var/app` שלא השתנו יותר מ-7 ימים, ומחקו אותם.
    explanation: |
      `-mtime +7` = השתנה לפני יותר מ-7 ימים.
      **קודם מריצים בלי `-delete`**, כדי לראות מה יימחק.
      שמים מירכאות סביב `'*.log'`, כדי שה-shell לא יפרש את הכוכבית בעצמו.

  bash-text-007:
    prompt: ספרו כמה שורות יש בקובץ `app.log`.
    explanation: "`wc -l` סופר שורות, `-w` מילים, ו-`-c` בתים. עם `<` מקבלים רק את המספר, בלי שם הקובץ, וזה נוח בסקריפטים."

  bash-text-008:
    prompt: הציגו את כל השורות ב-`app.log` ש**לא** מכילות `DEBUG`.
    explanation: "`-v` הופך את החיפוש. אפשר לשרשר כדי לסנן רעש: `grep ERROR app.log | grep -v healthcheck`."

  bash-text-009:
    prompt: השדות בקובץ `/etc/passwd` מופרדים בנקודתיים (`:`). הדפיסו רק את השדה הראשון (שמות המשתמשים).
    explanation: "`cut -d` קובע את התו המפריד (ברירת המחדל היא tab), ו-`-f` בוחר שדות, למשל `-f1,3`. awk עושה את אותו הדבר עם `-F:`, והוא גמיש יותר כשצריך תנאים."

  bash-ol-001:
    prompt: ספרו כמה שורות ב-`app.log` מכילות את המילה `timeout`, בלי הבדל בין אותיות גדולות לקטנות.
    explanation: "`grep -c` סופר **שורות** שמתאימות, לא מופעים. כדי לספור מופעים: `grep -oi timeout app.log | wc -l`."

  bash-ol-002:
    prompt: הציגו את 10 הקבצים והתיקיות הגדולים ביותר בתיקייה הנוכחית, מהגדול לקטן, בגדלים קריאים.
    explanation: "`sort -h` מבין גדלים כמו K, M ו-G. `sort -r` רגיל היה שם את `9K` לפני `1G`."

  bash-ol-003:
    prompt: מה עושה `xargs` ב-`find . -name '*.tmp' | xargs rm`?
    options:
      - "הופך את השורות שמגיעות מהקלט לארגומנטים של rm (בקבוצות)"
      - "מריץ rm פעם אחת לכל שורה, ומטפל בבטחה בכל שם קובץ"
      - "מדפיס את הארגומנטים בלי להריץ כלום"
      - "מחכה ש-find יסתיים לפני שהוא מתחיל"
    explanation: |
      xargs בונה שורת פקודה מהקלט שהוא מקבל.
      שמות קבצים עם רווחים שוברים אותו, ולכן משתמשים ב-`find … -print0 | xargs -0 rm`, או פשוט `find … -delete` או `-exec rm {} +`.
      `xargs -P 4` מריץ 4 במקביל.

  bash-ol-004:
    prompt: שרת web מחזיר חלק מהבקשות עם שגיאות 5xx. רק עם כלי shell על `access.log` (קוד הסטטוס בשדה 9), איך תמצאו אילו כתובות URL מחזירות הכי הרבה 5xx?
    keyPoints:
      - "מסננים שורות שבהן שדה הסטטוס מתחיל ב-5 (awk '$9 ~ /^5/')"
      - "שולפים את שדה ה-URL ($7)"
      - "sort | uniq -c | sort -rn | head כדי לדרג"
      - "אופציונלי: להגביל לחלון זמן, או לספור לכל קוד סטטוס בנפרד"
    modelAnswer: |
      עם awk אפשר לסנן ולשלוף בפעולה אחת:
      `awk '$9 ~ /^5/ {print $7}' access.log | sort | uniq -c | sort -rn | head`
      זה משאיר רק שורות שבהן השדה ה-9 (הסטטוס) מתחיל ב-5, מדפיס את השדה ה-7 (הנתיב), ואז סופר ומדרג.
      כדי לראות גם את הקוד המדויק, מדפיסים `$9, $7`.
      כדי להתמקד בשעה האחרונה, מסננים קודם לפי שדה הזמן, או לוקחים רק את סוף הקובץ עם `tail -n`.
      אם פרמטרים ב-URL (מה שאחרי `?`) הופכים כל כתובת לשונה, מורידים אותם עם `sub(/\?.*/, "", $7)` בתוך awk.
    explanation: בעבודה אמיתית שואלים את זה במערכת הלוגים (Loki, ELK, CloudWatch Logs Insights), אבל אותה חשיבה עובדת שם, והשאלה מופיעה בראיונות חיים.

  bash-ol-005:
    prompt: מצאו אילו קבצים תחת `/etc` מכילים את הטקסט `10.0.0.5`. הדפיסו רק את שמות הקבצים.
    explanation: "`-r` מחפש בכל הקבצים בתיקייה, ו-`-l` מציג רק את שמות הקבצים שנמצאה בהם התאמה. שימושי לפני שמשנים כתובת IP או שם שרת. בביטוי רגולרי `.` מתאים לכל תו, ולכן `-F` (טקסט מדויק) מדויק יותר."

  bash-ol-006:
    prompt: הריצו את `df -h` שוב ושוב כל 5 שניות, כדי לראות איך השימוש בדיסק משתנה.
    explanation: "`watch` מריץ פקודה שוב ושוב ומציג את הפלט האחרון על כל המסך. ברירת המחדל היא כל 2 שניות, ו-`-d` מדגיש מה השתנה. אותו רעיון: `watch kubectl get pods`."
