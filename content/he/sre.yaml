topic: sre
questions:
  sre-avail-001:
    prompt: מה ההבדל בין גדילה אופקית (horizontal scaling) לגדילה אנכית (vertical scaling)? מה עדיף לאפליקציית web, ומה זה דורש?
    keyPoints:
      - "אנכית: מחליפים לשרת חזק יותר (יותר CPU וזיכרון). פשוט, אבל יש תקרה, בדרך כלל צריך הפעלה מחדש, ועדיין יש שרת אחד שיכול ליפול"
      - "אופקית: מוסיפים עוד שרתים מאחורי load balancer. גדל הרבה יותר, ונותן גיבוי אם שרת נופל"
      - "גדילה אופקית דורשת שהאפליקציה לא תשמור מידע אצלה (stateless): sessions וקבצים במקום משותף (DB, Redis, S3)"
      - "מסדי נתונים קשים יותר לגדילה אופקית (עותקים לקריאה, חלוקה)"
    modelAnswer: |
      **גדילה אנכית** היא שרת חזק יותר: יותר CPU ויותר זיכרון. זה פשוט, אבל יש תקרה, לרוב צריך להפעיל מחדש, ועדיין יש שרת אחד שאם הוא נופל, הכל נופל.
      **גדילה אופקית** היא עוד שרתים מאחורי load balancer. אפשר לגדול הרבה יותר, אפשר לעשות את זה אוטומטית (ASG, HPA), ואם שרת אחד נופל, השאר ממשיכים.
      לאפליקציות web מעדיפים גדילה אופקית. בשביל זה האפליקציה חייבת להיות stateless: sessions, קבצים שהועלו ו-cache חייבים להיות במקום משותף כמו מסד הנתונים, Redis או S3, ולא בשרת עצמו. כך כל שרת יכול לענות לכל בקשה.
      מסדי נתונים קשים יותר: מוסיפים עותקים לקריאה, cache, ובשלב מאוחר חלוקה לכמה שרתים (sharding).
    explanation: עקרונות twelve-factor app מתארים מה הופך אפליקציה לקלה לגדילה אופקית.

  sre-avail-002:
    prompt: מה ההבדל בין זמינות גבוהה (high availability) לעמידות בתקלות (fault tolerance)?
    options:
      - "זמינות גבוהה מצמצמת השבתות בעזרת גיבוי ומעבר מהיר (ייתכנו כמה שניות-דקות של הפרעה); עמידות בתקלות ממשיכה בלי שום הפרעה כשרכיב נופל"
      - "זה אותו דבר"
      - "עמידות בתקלות זולה יותר"
      - "זמינות גבוהה = גיבויים"
    explanation: "RDS Multi-AZ הוא זמינות גבוהה (המעבר לוקח דקה-שתיים). עמידות אמיתית, כמו שני אתרים פעילים במקביל, עולה יותר. שניהם שונים משחזור מאסון (disaster recovery), שזה לחזור לפעולה אחרי תקלה גדולה."

  sre-avail-003:
    prompt: מה זה "single point of failure" (נקודת כשל יחידה)?
    options:
      - "רכיב שאם הוא נופל, כל המערכת נופלת, כי אין מי שיחליף אותו"
      - "השגיאה הראשונה בקובץ לוג"
      - "שרת עם מעבד אחד"
      - "פריסה שנכשלה"
    explanation: "שרת מסד נתונים אחד, load balancer אחד, NAT gateway אחד, region אחד. מורידים נקודות כשל כאלה בעזרת גיבוי: עוד עותקים, כמה AZs, מעבר אוטומטי."

  sre-avail-004:
    prompt: למה אפליקציית web חייבת להיות stateless כדי לגדול אופקית?
    options:
      - "כל שרת יכול לקבל כל בקשה, ולכן sessions וקבצים חייבים להיות באחסון משותף ולא בשרת אחד"
      - "אפליקציות stateless צורכות פחות CPU"
      - "load balancer לא יכול להתחבר לאפליקציה stateful"
      - "Kubernetes מחייב את זה"
    explanation: "אם ה-session שמור בזיכרון של שרת אחד, הבקשה הבאה יכולה להגיע לשרת אחר, והמשתמש פתאום מנותק. שמים sessions ב-Redis או במסד נתונים, וקבצים ב-S3."

  sre-avail-005:
    prompt: מה זה graceful degradation (נפילה עדינה)? תנו דוגמה.
    keyPoints:
      - "כשרכיב נופל, המערכת ממשיכה לעשות את הדבר העיקרי, עם פחות יכולות, במקום ליפול כולה"
      - "דוגמה: להציג מידע מה-cache או ברירת מחדל, להסתיר חלק לא חשוב, לשמור פעולות כתיבה לאחר כך"
      - "עושים את זה עם timeouts, חלופות (fallback) ו-circuit breakers"
    modelAnswer: |
      נפילה עדינה אומרת שכשחלק מהמערכת נופל, הדבר העיקרי ממשיך לעבוד, פשוט עם פחות.
      דוגמה: אם שירות ההמלצות בחנות אונליין למטה, החנות עדיין מציגה מוצרים ומאפשרת לשלם. היא רק מסתירה את "אולי תאהבו גם".
      בפרויקט MyBroker שלי: אם ספק המחירים למטה, האפליקציה ממשיכה לעבוד עם המחירים האחרונים שנשמרו, ומציגה אזהרה.
      איך מגיעים לזה: timeout לכל קריאה לשירות חיצוני, חלופה כמו מידע מה-cache או ברירת מחדל, ו-circuit breaker שמפסיק לקרוא לשירות שכל הזמן נכשל.
    explanation: 'ההפך הוא נפילה מתגלגלת (cascading failure): תלות אחת איטית גורמת לכל הבקשות להיתקע, וכל האתר נופל.'

  sre-db-001:
    prompt: מה זה caching, איפה אפשר להשתמש בו באפליקציית web, ומה החלק הקשה?
    keyPoints:
      - "caching שומר מידע שמשתמשים בו הרבה במקום מהיר, כדי לא לחשב אותו שוב או לפנות לשירות איטי"
      - "שכבות: הדפדפן (HTTP headers), CDN, reverse proxy, cache של האפליקציה (Redis, Memcached), ובתוך מסד הנתונים"
      - "החלק הקשה: מתי לרענן (invalidation) ומידע ישן; TTL ועדכון ה-cache בכתיבה"
      - "עוד בעיות: הרבה בקשות בבת אחת כשמפתח פג (stampede), ומגבלות זיכרון ומחיקה (LRU)"
    modelAnswer: |
      cache שומר את התוצאה של עבודה יקרה, כמו שאילתה למסד נתונים, קריאה ל-API או דף מוכן, במקום מהיר יותר. כך הבקשה הבאה לא משלמת את המחיר המלא.
      אפשר להשתמש בו בכל שכבה: בדפדפן דרך HTTP headers, ב-CDN כמו CloudFront לקבצים סטטיים ואפילו לתשובות API, ב-reverse proxy, בתוך האפליקציה עם Redis או Memcached, ובתוך מסד הנתונים.
      החלק הקשה הוא מתי לרענן. כשהמידע המקורי משתנה, העותק ב-cache מתיישן. לכן קובעים TTL לכל סוג מידע, ומוחקים או מעדכנים את המפתח בכל כתיבה.
      עוד מלכודות: כשמפתח פופולרי פג, אלפי בקשות מגיעות למסד הנתונים בבת אחת (cache stampede). ויש מגבלת זיכרון, ולכן צריך מדיניות מחיקה כמו LRU.
    explanation: '"There are only two hard things in computer science: cache invalidation and naming things."'

  sre-db-002:
    prompt: למה לשים תור הודעות (SQS, RabbitMQ, Kafka) בין API לבין שירות עיבוד איטי?
    options:
      - "כדי להפריד ביניהם: ה-API עונה מהר, העבודה מחכה בתור בזמן עומס, כל צד גדל בנפרד, ואפשר לנסות שוב"
      - "כדי שהבקשות יהיו סינכרוניות"
      - "כדי לשמור סיסמאות"
      - "כדי להחליף את מסד הנתונים"
    explanation: "תורים סופגים עומסים ומבודדים תקלות. כדאי לנטר את אורך התור (סימן טוב להגדלה אוטומטית). רוב התורים יכולים למסור הודעה יותר מפעם אחת, ולכן מי שמעבד אותן צריך להיות idempotent."

  sre-db-003:
    prompt: מתי לבחור מסד נתונים NoSQL כמו DynamoDB או MongoDB במקום מסד רלציוני כמו PostgreSQL?
    options:
      - "כשהמבנה גמיש ומשתנה, או כשניגשים לפי מפתח פשוט בהיקף עצום; מסד רלציוני עדיף לשאילתות מורכבות, joins ועקביות חזקה"
      - "תמיד, NoSQL חדש יותר"
      - "אף פעם, מסד רלציוני תמיד עדיף"
      - "רק לשמירת תמונות"
    explanation: ברירת המחדל היא מסד רלציוני, אלא אם יש סיבה טובה. DynamoDB מצוין כשיודעים מראש איך ניגשים למידע ובהיקפים ענקיים, אבל שאילתות חופשיות קשות בו.

  sre-db-004:
    prompt: מה עושה אינדקס במסד נתונים?
    options:
      - "מאפשר למצוא שורות לפי עמודה בלי לסרוק את כל הטבלה, במחיר של כתיבה איטית יותר ויותר מקום"
      - "מגבה את הטבלה"
      - "מצפין עמודה"
      - "מחלק את מסד הנתונים לכמה שרתים"
    explanation: "אינדקס חסר על עמודה שמסננים לפיה הוא אחת הסיבות הנפוצות לשאילתות איטיות ולעומס על הדיסק."

  sre-db-005:
    prompt: האפליקציה איטית ואתם חושדים במסד הנתונים. מה בודקים?
    keyPoints:
      - "שאילתות איטיות: slow query log או pg_stat_statements, ו-EXPLAIN כדי למצוא סריקה מלאה או אינדקס חסר"
      - "צריכת משאבים במסד: CPU, זיכרון, דיסק, חיבורים"
      - "כמות חיבורים / מאגר חיבורים שנגמר, ונעילות"
      - "תיקונים: להוסיף אינדקס, cache לקריאות נפוצות, עותק לקריאה, connection pooling, לתקן בעיית N+1"
    modelAnswer: |
      קודם מוודאים שזה באמת מסד הנתונים: האם ה-traces או הלוגים של האפליקציה מראים שאילתות ארוכות?
      במסד עצמו מחפשים את השאילתות האיטיות ביותר. ב-PostgreSQL עם ה-slow query log או `pg_stat_statements`. מריצים עליהן `EXPLAIN` כדי לראות סריקה של כל הטבלה או אינדקס חסר.
      בודקים CPU, זיכרון, דיסק ומספר החיבורים. חיבורים שנגמרו או המתנה לנעילות גם נראים כמו "איטי".
      תיקונים נפוצים: להוסיף את האינדקס החסר, לשמור קריאות נפוצות ב-Redis, לשלוח קריאות לעותק (replica), להשתמש ב-connection pooling, ולתקן בקוד את בעיית N+1.
    explanation: "N+1 זה שאילתה אחת לרשימה, ואז עוד שאילתה לכל פריט. 1 + 100 שאילתות במקום 2."

  sre-inc-001:
    prompt: מה זה postmortem בלי האשמות (blameless), ומה צריך להיות בו?
    keyPoints:
      - "סיכום כתוב אחרי תקלה, שמתמקד במערכות ובתהליכים ולא באנשים, כדי שכולם ישתפו בכנות"
      - "סיכום והשפעה (על מי ולכמה זמן), ציר זמן, סיבת שורש וגורמים תורמים"
      - "מה עבד טוב ומה פחות בגילוי ובתגובה"
      - "משימות המשך עם אחראי ותאריך, כדי שזה לא יקרה שוב ושיגלו מהר יותר"
    modelAnswer: |
      postmortem בלי האשמות הוא סיכום כתוב אחרי תקלה. ההנחה היא שאנשים פעלו בסבירות לפי המידע שהיה להם, והשאלה היא מה במערכת או בתהליך אפשר את התקלה. אם מאשימים, אנשים מסתירים טעויות, ואז אי אפשר לתקן את הסיבות האמיתיות.
      מה יש בו:
      - סיכום, והשפעה על הלקוחות: מי נפגע ולכמה זמן.
      - ציר זמן: מהסימן הראשון, דרך הגילוי והתיקון הזמני, ועד הפתרון.
      - סיבת השורש והגורמים שתרמו (שואלים "למה" כמה פעמים).
      - מה עבד טוב ומה פחות.
      - והכי חשוב: משימות המשך מוחשיות, עם אחראי ותאריך. למשל להוסיף התראה, בדיקה או מנגנון הגנה, או להפוך צעד ידני לאוטומטי. ובאמת לבצע אותן.
    explanation: "מדדים שימושיים: MTTD (כמה זמן עד שגילינו) ו-MTTR (כמה זמן עד שתיקנו)."

  sre-inc-002:
    prompt: סדרו את השלבים של טיפול בתקלה בפרודקשן.
    steps:
      - "גילוי (התראה או דיווח של משתמש) ואישור שמישהו מטפל"
      - "הערכת חומרה ועדכון (ערוץ תקלה, עמוד סטטוס)"
      - "תיקון זמני: להחזיר את השירות (חזרה לגרסה קודמת, מעבר לגיבוי, הגדלה)"
      - "פתרון הבעיה עצמה"
      - "postmortem עם משימות המשך"
    explanation: קודם מחזירים את השירות, ורק אחר כך מחפשים את הסיבה. מעדכנים את כל הגורמים לאורך כל הדרך. בתקלה גדולה ממנים מישהו שמנהל את התקלה (incident commander).

  sre-inc-003:
    prompt: בזמן תקלה גדולה, מה התפקיד של מנהל התקלה (incident commander)?
    options:
      - "לתאם: לקבוע סדרי עדיפויות, לחלק משימות ולדאוג לתקשורת; לא בהכרח לתקן בעצמו"
      - "לכתוב את כל התיקונים בקוד"
      - "למצוא מי אשם"
      - "להפעיל מחדש את כל השרתים"
    explanation: "הפרדה בין תיאום לבין עבודה בידיים מונעת מתקלה גדולה להפוך לבלגן. בדרך כלל מישהו אחר אחראי על עדכוני הסטטוס."

  sre-inc-004:
    prompt: מה זה runbook?
    options:
      - "מדריך כתוב, צעד אחר צעד, לטיפול בהתראה מוכרת או במשימה תפעולית"
      - "רשימת תהליכים שרצים"
      - "קובץ של pipeline ב-CI"
      - "יומן של פריסות קודמות"
    explanation: "כל התראה צריכה לקשר ל-runbook: מה היא אומרת, איך בודקים, איך מתקנים ולמי פונים. כך כל מי שבתורנות יכול לפעול מהר, לא רק המומחה."

  sre-inc-005:
    prompt: מה זה תורנות (on call), ומה הופך אותה לנסבלת לאורך זמן?
    keyPoints:
      - "אדם שמתחלף בסבב ואחראי להגיב להתראות של פרודקשן גם מחוץ לשעות העבודה"
      - "התראות צריכות להיות מעטות ושיש מה לעשות איתן; התראות רועשות שוחקות"
      - "runbooks, מסלול הסלמה ברור, והעברה מסודרת בין משמרות"
      - "סבב הוגן, ותיקון של הסיבות להתראות שחוזרות"
    modelAnswer: |
      תורנות אומרת שלתקופה, בדרך כלל שבוע בסבב, אדם אחד אחראי להגיב להתראות של פרודקשן, גם בלילה.
      היא נסבלת כשהקפצות נדירות ובאמת דורשות פעולה: כל התראה אומרת שמשהו באמת לא בסדר וצריך אדם עכשיו.
      לכל התראה יש runbook. יש למי לפנות אם נתקעים. ויש העברה מסודרת בין משמרות.
      הסבב מתחלק בהוגנות, והצוות באמת מתקן את הסיבות להתראות שחוזרות, במקום להתרגל אליהן.
    explanation: "יעד נפוץ: לא יותר משתי תקלות בערך בכל משמרת. יותר מזה אומר שצריך להשקיע באמינות."

  sre-design-001:
    prompt: תכננו פריסה זמינה וגדילה לאפליקציית web פשוטה עם מסד נתונים ב-AWS. תארו את הרכיבים.
    keyPoints:
      - "VPC על לפחות 2-3 AZs, עם subnets ציבוריים ופרטיים"
      - "load balancer (ALB) ב-subnets הציבוריים; שרתי האפליקציה ב-subnets הפרטיים עם הגדלה אוטומטית (ASG, ECS או EKS) על כמה AZs"
      - "מסד נתונים מנוהל (RDS או Aurora) Multi-AZ ב-subnets פרטיים, עם גיבויים, ואולי עותקים לקריאה; cache (ElastiCache)"
      - "קבצים סטטיים ב-S3 + CloudFront; DNS ב-Route 53; תעודה מ-ACM"
      - "security groups לכל שכבה, ניטור והתראות (CloudWatch), תשתית כקוד (Terraform), CI/CD"
    modelAnswer: |
      **רשת:** VPC על שלושה Availability Zones. בכל אחד subnet ציבורי ו-subnet פרטי.
      **כניסה:** Route 53 מפנה את הדומיין ל-Application Load Balancer ב-subnets הציבוריים, עם תעודה מ-ACM.
      **אפליקציה:** שרתים stateless ב-subnets הפרטיים, ב-Auto Scaling group או כשירותים ב-ECS או EKS, מפוזרים על כל ה-AZs. הם גדלים לפי CPU או לפי כמות בקשות, וה-ALB בודק את תקינותם.
      **מידע:** RDS (או Aurora) Multi-AZ ב-subnets הפרטיים, עם גיבויים אוטומטיים, ועותק לקריאה אם יש הרבה קריאות. ElastiCache Redis ל-sessions ול-cache. קבצים סטטיים ב-S3 מאחורי CloudFront.
      **אבטחה:** security groups בשרשרת: ל-ALB מותר מהאינטרנט על 443, לאפליקציה רק מה-ALB, למסד רק מהאפליקציה. NAT gateways נותנים ל-subnets הפרטיים יציאה לאינטרנט.
      **תפעול:** הכל מוגדר ב-Terraform, נפרס דרך CI/CD, ומנוטר עם CloudWatch או Prometheus.
      כך נפילה של שרת אחד, או של AZ שלם, לא מפילה את האתר.
    explanation: מציירים תוך כדי דיבור (קופסה לכל AZ), ומזכירים שיקולים כמו עלות (NAT בכל AZ) ו-multi-region לשחזור מאסון.

  sre-design-002:
    prompt: איך הייתם מתכננים מקצר כתובות (URL shortener) פשוט שיעמוד בהרבה תעבורה?
    keyPoints:
      - "שרתי אפליקציה stateless מאחורי load balancer, עם הגדלה אוטומטית"
      - "מסד נתונים שממפה קוד קצר לכתובת ארוכה; יצירה של קוד ייחודי"
      - "יש הרבה יותר הפניות (קריאות) מיצירות (כתיבות), ולכן שמים cache (Redis או CDN) לפני מסד הנתונים"
      - "ניטור, הגבלת קצב נגד ניצול לרעה, וכמה AZs לזמינות"
    modelAnswer: |
      יש שתי פעולות: ליצור קישור קצר, ולהפנות מקישור קצר לכתובת המלאה. הפניות קורות הרבה יותר, ולכן מתכננים בשביל קריאות.
      שרתי אפליקציה stateless מאחורי load balancer, עם הגדלה אוטומטית על כמה AZs.
      טבלה במסד הנתונים ממפה קוד קצר לכתובת ארוכה. את הקוד יוצרים ממספר רץ שמומר ל-base62, או ממחרוזת אקראית שבודקים שהיא ייחודית.
      אותם קישורים פופולריים נקראים שוב ושוב, ולכן שמים Redis, או אפילו CDN, לפני מסד הנתונים. כך רוב ההפניות בכלל לא מגיעות למסד.
      מוסיפים הגבלת קצב נגד ניצול לרעה, וניטור של זמני תגובה ושל אחוז שגיאות.
    explanation: "בראיון מתחילים בשאלות על ההיקף (כמה בקשות בשנייה, יחס קריאה-כתיבה), מציירים את הגרסה הפשוטה, ואז משפרים."

  sre-dr-001:
    prompt: מה המשמעות של RPO ו-RTO בשחזור מאסון?
    options:
      - "RPO = כמה מידע מותר לאבד (הזמן מאז העותק התקין האחרון); RTO = תוך כמה זמן השירות חייב לחזור"
      - "RPO = מי אחראי לנקודת השחזור; RTO = מי אחראי לצוות"
      - "שניהם מודדים זמינות"
      - "RTO הוא כמה מידע אבד, RPO הוא כמה זמן השירות היה למטה"
    explanation: "RPO של 5 דקות דורש שכפול רציף או שחזור לכל נקודת זמן. RTO של 4 שעות אולי מאפשר שחזור מגיבוי לסביבה חדשה. ככל שהיעד קשוח יותר, זה עולה יותר."

  sre-dr-002:
    prompt: '"יש לנו גיבויים." אילו שאלות הייתם שואלים כדי לדעת אם זה באמת נכון?'
    keyPoints:
      - "מתי בפעם האחרונה בדקו שחזור? (גיבוי שלא שוחזר הוא תקווה, לא גיבוי)"
      - "מה מגובה (מסדי נתונים, דיסקים, הגדרות, סודות) ובאיזו תדירות (מתאים ל-RPO)?"
      - "איפה הגיבויים: בחשבון או ב-region אחר, ומוגנים ממחיקה ומ-ransomware?"
      - "כמה זמן לוקח שחזור (מתאים ל-RTO), האם יש הוראות או אוטומציה, והאם יש התראה כשגיבוי נכשל?"
    modelAnswer: |
      השאלה הראשונה: מתי בפעם האחרונה הצלחנו *לשחזר* מהם? גיבוי שלא בדקו הוא תקווה, לא גיבוי.
      אחר כך: מה בדיוק מגובה? מסדי נתונים ודיסקים, אבל גם הגדרות, סודות וקוד התשתית. באיזו תדירות, והאם זה מתאים ל-RPO?
      איפה הם שמורים? עדיף בחשבון וב-region אחרים, מוצפנים, ובלי אפשרות למחוק (S3 Object Lock, AWS Backup Vault Lock). כך מנהל אחד שנפרץ, או ransomware, לא יכולים למחוק אותם יחד עם הפרודקשן.
      כמה זמן לוקח שחזור מלא, והאם זה מתאים ל-RTO? האם יש הוראות כתובות או סקריפט? והאם מקבלים התראה כשגיבוי נכשל?
    explanation: '"3-2-1": שלושה עותקים, על שני סוגי אחסון, ואחד במקום אחר. תשתית כקוד ו-GitOps מאפשרים לבנות מחדש מהר את כל מה שלא שומר מידע. המידע עצמו הוא מה שצריך גיבוי.'

  sre-dr-003:
    prompt: מה זה כלל הגיבוי "3-2-1"?
    options:
      - "שלושה עותקים של המידע, על שני סוגי אחסון שונים, ועותק אחד במיקום אחר"
      - "לגבות 3 פעמים ביום, לשמור שבועיים, לבדוק שחזור פעם בשנה"
      - "3 שרתים, 2 מסדי נתונים, גיבוי 1"
      - "לשחזר תוך 3 שעות, לאבד לכל היותר שעתיים, לבדוק פעם אחת"
    explanation: "בענן, 'מיקום אחר' הוא בדרך כלל region או חשבון אחר. עדיף גיבויים שאי אפשר למחוק, כדי ש-ransomware או טעות לא יוכלו להעלים אותם."

  sre-avail-006:
    prompt: מה ההבדל בין מבנה active-active למבנה active-passive?
    options:
      - "active-active: כל העותקים מקבלים תעבורה באותו זמן. active-passive: אחד משרת, ועותק מחכה נכנס לפעולה רק כשהראשון נופל"
      - "active-active משתמש בשני עננים; active-passive באחד"
      - "active-passive תמיד מהיר יותר"
      - "הם אותו דבר"
    explanation: "שרתי web מאחורי load balancer הם active-active. מסד נתונים קלאסי עם עותק מחכה (RDS Multi-AZ) הוא active-passive. active-passive פשוט יותר, אבל הקיבולת של העותק המחכה לא מנוצלת."

  sre-avail-007:
    prompt: מה עושה "circuit breaker" בשירות שפונה לשירות אחר?
    options:
      - "אחרי הרבה כישלונות הוא מפסיק לפנות לשירות התקול לזמן מה ונכשל מהר (או משתמש בחלופה), כדי שתלות אחת שבורה לא תגרור את כל המערכת"
      - "מכבה את השרת כשה-CPU גבוה"
      - "מפעיל מחדש את השירות התקול"
      - "מצפין תעבורה בין שירותים"
    explanation: "בלעדיו, בקשות נערמות ומחכות ל-timeout, ולשירות שפונה נגמרים ה-threads או החיבורים. ניסיון חוזר עם המתנה הולכת וגדלה, timeouts ו-circuit breakers הולכים יחד."

  sre-db-006:
