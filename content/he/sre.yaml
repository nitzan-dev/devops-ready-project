  sre-design-003:
    prompt: מחלקת השיווק אומרת שבזמן מבצע בשבוע הבא התעבורה תהיה פי 10 מהרגיל. איך מתכוננים?
    keyPoints:
      - "בדיקת עומס מראש כדי למצוא את צוואר הבקבוק (הרבה פעמים מסד הנתונים, לא שרתי ה-web)"
      - "גדילה: בודקים את המגבלות של ה-autoscaling ואת ה-quotas, ומגדילים מראש לפני האירוע"
      - "הורדת עומס: CDN ו-cache לתוכן סטטי ופופולרי; תורים לעבודה איטית"
      - "הגנה על המערכת: הגבלת קצב, ופגיעה מבוקרת (לכבות פיצ'רים לא חיוניים)"
      - "ניטור, התראות ותוכנית on-call לאירוע; הקפאה של פריסות מסוכנות"
    modelAnswer: |
      קודם מגלים איפה זה נשבר: מריצים בדיקת עומס של פי 10 מול staging, ורואים איזה חלק נכשל ראשון. הרבה פעמים זה מסד הנתונים או API חיצוני, לא שרתי ה-web.
      אחר כך גדילה: בודקים את ערכי המקסימום של ה-HPA או ה-Auto Scaling, את ה-quotas בענן ואת הקיבולת של מסד הנתונים, ומגדילים מראש במקום לחכות שה-autoscaling יגיב.
      כדי להוריד עומס: תוכן סטטי ופופולרי עובר דרך CDN ו-cache, ועבודה איטית כמו מיילים ודוחות עוברת לתור.
      כדי להגן על המערכת: הגבלת קצב, ותוכנית לפגיעה מבוקרת, למשל לכבות המלצות אם מסד הנתונים מתקשה.
      ולבסוף: דשבורדים והתראות לאירוע, אנשים ב-on-call, ובלי פריסות מסוכנות באותו יום.
    explanation: "מראיינים אוהבים לשמוע \"קודם בדיקת עומס\": זה מראה שאתם מחליטים לפי מדידות, לא לפי ניחושים."
