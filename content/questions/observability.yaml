  - id: obs-pillars-005
    type: mcq
    subtopic: pillars
    level: 1
    prompt: In distributed tracing, what are a trace and a span?
    options:
      - "A trace is the whole journey of one request through all services; a span is one step in it (one service call or operation) with its duration"
      - "A trace is a log file; a span is a log line"
      - "A trace is a metric; a span is its label"
      - "They are alert types"
    correct: [0]
    explanation: "Traces show where time is spent: e.g. 1.8 of 2 seconds was a slow database query in the payment service. OpenTelemetry is the standard way to produce them; Jaeger and Tempo store them."

  - id: obs-prom-008
    type: mcq
    subtopic: prometheus
    level: 1
    prompt: What is a Prometheus exporter?
    options:
      - "A small program that exposes metrics of something that doesn't speak Prometheus (a Linux host, MySQL, nginx) on a /metrics endpoint"
      - "A tool that exports Grafana dashboards to PDF"
      - "A backup tool for Prometheus data"
      - "A plugin that sends alerts by email"
    correct: [0]
    explanation: "node_exporter exposes CPU, memory, disk and network of a Linux machine. Your own apps expose metrics directly with a client library instead."

  - id: obs-prom-009
    type: mcq
    subtopic: prometheus
    level: 1
    prompt: "In `http_requests_total{method=\"GET\", status=\"500\"}`, what are `method` and `status`?"
    options:
      - "Labels: key-value pairs that split one metric into separate time series you can filter and group by"
      - "Separate metrics"
      - "Comments"
      - "Alert names"
    correct: [0]
    explanation: "Labels let you ask `sum by (status) (rate(http_requests_total[5m]))`. Every unique label combination is a separate series, so keep labels to a small set of values."

  - id: obs-prom-010
    type: mcq
    subtopic: prometheus
    level: 2
    prompt: Why do you almost always wrap a counter in `rate()` instead of looking at its raw value?
    options:
      - "A counter only goes up (and resets to 0 when the app restarts); rate() gives the per-second speed and handles the resets"
      - "Raw counter values are encrypted"
      - "rate() makes queries cheaper"
      - "Counters can't be shown in Grafana"
    correct: [0]
    explanation: "A raw value like 1,284,553 total requests tells you little. `rate(...[5m])` tells you \"42 requests per second right now\". Use `increase()` for \"how many in the last hour\"."

  - id: obs-graf-005
    type: mcq
    subtopic: grafana-alerting
    level: 1
    prompt: What should a good alert notification include? (Select all.)
    options:
      - "What is wrong and how bad it is (summary and severity)"
      - "Which service or environment is affected"
      - "A link to a runbook or dashboard"
      - "The full application source code"
    correct: [0, 1, 2]
    explanation: "The person woken up at 3 a.m. should know within seconds what's broken and where to start. Alertmanager templates and annotations like `runbook_url` help."

  - id: obs-graf-006
    type: mcq
    subtopic: grafana-alerting
    level: 2
    prompt: Which of these should page (wake up) the on-call engineer?
    options:
      - "Users are getting errors: the error rate has been above 5% for 5 minutes"
      - "One server's CPU is at 85%"
      - "A pod restarted once"
      - "Disk usage is at 60%"
    correct: [0]
    explanation: "Page on **symptoms** users feel (errors, latency, availability). Causes like high CPU go to dashboards or low-priority tickets. Disk filling up fast is the exception: alert on predicted time to full."

  - id: obs-slo-005
    type: mcq
    subtopic: slos
    level: 1
    prompt: What's the difference between an SLO and an SLA?
    options:
      - "An SLO is an internal reliability target; an SLA is a promise in a contract, with penalties (like refunds) if it's missed"
      - "They are the same thing"
      - "An SLA is internal; an SLO is in the contract"
      - "An SLO is only for databases"
    correct: [0]
    explanation: "The SLO is usually stricter than the SLA (e.g. SLO 99.95%, SLA 99.9%), so you notice problems and react before you owe customers money."

  - id: obs-log-006
    type: mcq
    subtopic: logging
    level: 1
    prompt: Which log level setting is usual for an application in production?
    options:
      - "INFO (with WARN and ERROR); DEBUG only temporarily, when investigating a problem"
      - "DEBUG all the time, to have everything"
      - "No logging at all"
      - "Only FATAL"
    correct: [0]
    explanation: "DEBUG in production creates huge volumes, costs money and can leak sensitive data. Make the level configurable (an env var) so you can raise it without a new build."
