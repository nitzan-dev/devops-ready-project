topic: behavioral
questions:
  beh-intro-001:
    prompt: ספרו על עצמכם. (ענו כמו בתחילת ראיון ל-DevOps ג'וניור, בערך 90 שניות. החלק הזה בדרך כלל באנגלית, אז כדאי להתאמן באנגלית.)
    keyPoints:
      - "מבנה קצר: הווה ← עבר ← עתיד (מי אתם עכשיו, רקע רלוונטי, למה התפקיד הזה)"
      - "מדגיש ניסיון מעשי ב-DevOps (פרויקט הקורס: Kubernetes, Terraform, CI/CD, GitOps, ניטור)"
      - "מראה מוטיבציה ורצון ללמוד, ומקשר לחברה ולתפקיד"
      - "קצר (לא סיפור חיים), בטוח, בלי פרטים לא רלוונטיים"
    modelAnswer: |
      **הווה**: אני בסוף קורס DevOps. בקורס בניתי פלטפורמה שלמה בסגנון production לאפליקציית web שכתבתי: Terraform יוצר cluster של Kubernetes עם ingress, TLS, ניטור ב-Prometheus וב-Grafana, ו-Argo CD. GitHub Actions מריץ CI עם בדיקות וסריקות אבטחה, ומשם הקוד מגיע דרך GitOps ל-staging ול-production.
      **עבר**: לפני זה [הרקע שלכם במשפט אחד, למשל עבודה בתמיכת IT, לימודי X, פיתוח Y]. שם התחברתי לאוטומציה ולהבנה של איך מערכות רצות ב-production.
      מה שהכי מהנה בשבילי הוא ה-troubleshooting: להבין למה משהו נשבר, ולוודא שהוא לא יישבר שוב באותה צורה.
      **עתיד**: מה שמעניין אותי הוא תפקיד DevOps ג'וניור בצוות מנוסה, שבו אפשר ללמוד, לקחת אחריות על תשתית אמיתית ולהתקדם. העבודה של הצוות שלכם על [משהו מוחשי על החברה] היא בדיוק זה.
    explanation: "הווה ← עבר ← עתיד, 60 עד 90 שניות. מכינים מראש, אבל לא מדקלמים מילה במילה. משלימים את הרקע שלכם בסוגריים, ומתאמנים באנגלית."

  beh-intro-002:
    prompt: למה אתם רוצים לעבוד ב-DevOps? (בדרך כלל עונים באנגלית.)
    keyPoints:
      - "מוטיבציה אמיתית ומוחשית (אוטומציה, אמינות, לראות את כל המערכת, לחבר בין פיתוח לתפעול)"
      - "מגבה אותה בחוויה מוחשית (משהו שבניתם או תיקנתם ונהניתם ממנו)"
      - "מבין מה העבודה באמת כוללת (תורנויות on-call, פתרון תקלות, עבודת צוות, למידה כל הזמן)"
    modelAnswer: |
      מה שמושך אותי הוא לעבוד על כל המערכת ולא רק על חלק ממנה: איך קוד הופך לשירות שרץ, ואיך השירות נשאר תקין.
      בפרויקט הקורס, הרגעים הכי מהנים היו כשהפכתי משהו ידני לאוטומטי, כמו לגרום לכל ה-cluster להיווצר ב-Terraform apply אחד, וכשחיפשתי באגים שעוברים בין שכבות, כמו בעיית NetworkPolicy שהופיעה רק אחרי שה-VM של Docker נכנס לשינה.
      ברור לי ש-DevOps זה גם on-call, פתרון תקלות תחת לחץ, ולמידה של כלים חדשים כל הזמן, וזה חלק ממה שמושך אותי.
      ומה שמספק במיוחד הוא שרואים את ההשפעה: pipeline מהיר יותר או התראה טובה יותר משפרים את העבודה של כל צוות הפיתוח.
    explanation: להימנע מ"כי זה משלם טוב" או "כי יש ביקוש". להראות סקרנות ודוגמה מוחשית.

  beh-intro-003:
    prompt: מה החולשה הכי גדולה שלכם? (בדרך כלל עונים באנגלית.)
    keyPoints:
      - "חולשה אמיתית שקשורה לעבודה (לא יתרון מוסווה כמו 'אני עובד יותר מדי')"
      - "דוגמה קצרה ומוחשית לאיך היא באה לידי ביטוי"
      - "מה אתם עושים באופן פעיל כדי להשתפר, ומה התוצאה אם אפשר"
      - "קצר, כן ורגוע; החולשה היא לא דרישה מרכזית בתפקיד"
    modelAnswer: |
      _(דוגמה בלבד. בחרו חולשה שבאמת שלכם.)_
      יש לי נטייה להתעמק בבעיה לבד יותר מדי זמן לפני בקשת עזרה. בפרויקט הקורס ביזבזתי כמעט יום שלם על בעיה ב-provider של Terraform, שחבר לכיתה כבר פתר.
      היום יש לי כלל קבוע: שעה בערך בלי התקדמות, ואז לכתוב מה ניסיתי ולשאול.
      זה גם משפר את השאלות שלי, כי ברור לי בדיוק איפה הבעיה, והפתרון מגיע הרבה יותר מהר.
    explanation: "חולשה ← דוגמה ← מה עושים איתה. להימנע מחולשות שפוסלות לתפקיד (כמו \"אני לא אוהב לפתור תקלות\")."

  beh-intro-004:
    prompt: בסוף הראיון שואלים אתכם "Do you have any questions for us?". מה הייתם שואלים?
    keyPoints:
      - "תמיד יש 2 או 3 שאלות מוכנות; אף פעם לא עונים 'אין לי שאלות'"
      - "שואלים על העבודה: הצוות, הטכנולוגיות, איך עובדות הפריסות וה-on-call, האתגר הכי גדול עכשיו"
      - "שואלים על התפתחות: קליטה של ג'וניורים, חניכה, איך נראית הצלחה ב-3 החודשים הראשונים"
      - "לא פותחים בשכר או בחופשות; השאלות מראות עניין בחברה הספציפית"
    modelAnswer: |
      מכינים שלוש או ארבע, ובוחרים את אלה שעוד לא קיבלו תשובה:
      - "What does a typical week look like for a junior on the team?"
      - "How do you deploy to production today, and what would you like to improve about it?"
      - "How does on-call work, and when would a junior join it?"
      - "What would success look like for me after three months?"
      - "What's the biggest infrastructure challenge the team is dealing with right now?"
      שכר והטבות משאירים לשלב של משאבי האנוש.
    explanation: "שאלות טובות מראות שאתם חושבים על לעשות את העבודה, לא רק על לקבל אותה. התשובות גם עוזרות לכם להחליט אם אתם רוצים את התפקיד."

  beh-story-001:
    prompt: ספרו על פעם שהייתם צריכים ללמוד טכנולוגיה חדשה מהר. (השתמשו במבנה STAR, ובדרך כלל באנגלית.)
    keyPoints:
      - "ה-Situation וה-Task ברורים וקצרים"
      - "Action: דרך למידה מוחשית (תיעוד, ניסויים קטנים, לבנות משהו, לבקש עזרה)"
      - "Result: תוצאה מוחשית (זה עבד, ואם אפשר, עם מספרים)"
      - "מסקנה: מה הייתם עושים אחרת, ומה למדתם על איך אתם לומדים"
    modelAnswer: |
      _(דוגמה בלבד. מראיינים מזהים סיפור מומצא, אז ספרו סיפור אמיתי שלכם באותו מבנה.)_
      **Situation**: בפרויקט הקורס נדרשתי לפרוס עם GitOps, ומעולם לא עבדתי עם Argo CD.
      **Task**: תוך שבוע בערך, ש-staging ו-production ייפרסו אוטומטית מ-Git, עם קידום ביניהם.
      **Action**: קראתי את מדריך ההתחלה הרשמי, והתקנתי Argo CD על ה-cluster של kind עם Application אחד, כדי להבין sync ו-health. אחר כך קראתי על הדפוס app-of-apps, ובניתי Application ראשי שיוצר את staging ואת prod מאותו Helm chart עם values שונים. שברתי דברים בכוונה, למשל מחקתי deployment ידנית, כדי לראות את self-heal עובד. ושאלתי בפורום של הקורס כשההרשאות של ה-AppProject בלבלו אותי.
      **Result**: שתי הסביבות נפרסות מ-Git, שחרור הוא commit וחזרה לאחור היא revert, והדגמתי את זה בשידור חי בכיתה.
      **מה למדתי**: להתחיל מהדוגמה הכי קטנה שעובדת, ולהוסיף מושג אחד בכל פעם.
    explanation: STAR = Situation, Task, Action, Result. את רוב הזמן מקדישים ל-Action ול-Result. כדאי להכין 4 או 5 סיפורים ולהתאים אותם לשאלה.

  beh-story-002:
    prompt: ספרו על טעות שעשיתם ומה למדתם ממנה. (בדרך כלל באנגלית.)
    keyPoints:
      - "לוקח אחריות על טעות אמיתית (לא תשובה מזויפת כמו 'אני עובד קשה מדי')"
      - "מסביר בכנות מה הייתה ההשפעה, ומה עשה כדי לתקן מהר"
      - "לקח מוחשי, ושינוי בתהליך או בהרגלים כדי שזה לא יחזור"
      - "טון רגוע ובלי האשמות; מראה אחריות"
    modelAnswer: |
      _(דוגמה בלבד. מראיינים מזהים סיפור מומצא, אז ספרו סיפור אמיתי שלכם באותו מבנה.)_
      כשהקמתי את ה-cluster, הרצתי שינוי ב-Terraform בלי לקרוא את ה-plan בעיון. הוא החליף משאב במקום לעדכן אותו, ומחק את ההגדרות של Grafana ואת נתוני ה-Prometheus שאספתי להדגמה.
      תיקנתי את זה כששחזרתי את הדשבורדים מה-chart, כי הם היו כתובים כקוד, והרצתי שוב את בדיקת העומס כדי ליצור נתונים מחדש.
      הלקחים: תמיד לקרוא את ה-plan, במיוחד שורות שמסומנות "forces replacement". כל מה שחשוב לי צריך להיות מוגדר כקוד, כדי שאפשר יהיה ליצור אותו מחדש. והתיקון הנכון היה שינוי בתהליך, לא "להיזהר יותר".
      היום יש לי הרגל קבוע: לבדוק אם יש החלפות ב-plan לפני כל apply, ולשמור את נתוני ההדגמה כך שאפשר ליצור אותם שוב עם סקריפט.
    explanation: "מראיינים רוצים לראות אחריות ותיקון של התהליך. התאימו את זה לסיפור אמיתי שלכם."

  beh-story-003:
    prompt: ספרו על פעם שלא הסכמתם עם חבר צוות. איך התמודדתם? (בדרך כלל באנגלית.)
    keyPoints:
      - "מכבד: קודם ניסה להבין את הצד השני"
      - "השתמש בנתונים, בניסויים או בקריטריונים, ולא בדעות"
      - "הגיע להחלטה (גם אם לא שלו) והתחייב אליה"
      - "יחסים טובים אחר כך; מה למד"
    modelAnswer: |
      _(דוגמה בלבד. מראיינים מזהים סיפור מומצא, אז ספרו סיפור אמיתי שלכם באותו מבנה.)_
      בפרויקט קבוצתי בקורס, חבר צוות רצה לפרוס ישר מה-CI עם `helm upgrade`, ואני רציתי GitOps עם Argo CD.
      במקום להתווכח, שאלתי מה הכי חשוב לו: פשטות ומהירות. הסברתי את החששות שלי: לשמור פרטי גישה ל-cluster ב-CI, ושאין תיעוד של מה פרוס.
      הסכמנו לנסות את שתי הדרכים במהירות ולהשוות לפי הקריטריונים האלה. הדרך של ה-CI הייתה פשוטה יותר להתחלה, אבל GitOps נתן לנו חזרה לאחור עם revert ותיקון של שינויים ידניים, וזה מה שהיינו צריכים להדגמה.
      הוא הסכים ללכת על GitOps, ואני דאגתי לכתוב README ברור, כדי שזה לא יהיה סיבוך נוסף בשבילו.
      אנחנו עדיין עובדים טוב ביחד, ולמדתי שהסכמה על קריטריונים מראש מנטרלת את רוב הוויכוחים.
    explanation: להראות שאתם מקשיבים, מחליטים לפי עובדות ומתחייבים להחלטה. אף פעם לא לדבר רע על האדם השני.

  beh-story-004:
    prompt: ספרו על פעם שהתמודדתם עם בעיה תחת לחץ זמן. (השתמשו במבנה STAR, ובדרך כלל באנגלית.)
    keyPoints:
      - "Situation ו-Task ברורים וקצרים, כולל מה היה מונח על הכף ומה היה הדדליין"
      - "Action: נשאר רגוע, קבע סדר עדיפויות (קודם לעצור את הנזק), ועדכן אחרים"
      - "Result: תוצאה מוחשית, עמידה בזמן או התאוששות ברורה"
      - "לקח, ומה שונה אחר כך כדי שזה לא יחזור"
    modelAnswer: |
      _(דוגמה בלבד. ספרו סיפור אמיתי שלכם באותו מבנה.)_
      **Situation**: בבוקר של הדגמת הפרויקט, האפליקציה ב-cluster הפסיקה לענות.
      **Task**: להחזיר אותה לעבודה תוך שעתיים בערך.
      **Action**: לא התחלתי לשנות דברים באקראי. בדקתי מבחוץ פנימה: הכתובת החזירה timeout, ה-ingress וה-pods נראו תקינים, ובדיקת חיבור בין pods הראתה שהתעבורה נחסמת. זה הוביל ל-NetworkPolicy, ומצאתי מצב ישן של policies אחרי ש-Docker Desktop נכנס לשינה. עדכנתי את המרצה מה קורה וכמה זמן זה צפוי לקחת.
      **Result**: תיקנתי תוך שעה, וההדגמה עברה בסדר.
      **לקח**: הוספתי `make` target וסעיף ב-runbook, כך שבפעם הבאה התיקון הוא פקודה אחת.
    explanation: "תחת לחץ, מראיינים רוצים לשמוע: רוגע, דרך עבודה מסודרת, תקשורת, ותיקון שמונע חזרה."
