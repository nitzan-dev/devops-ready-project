topic: linux
questions:
  linux-fhs-001:
    prompt: איפה נמצאים בדרך כלל קובצי ההגדרות של המערכת ב-Linux?
    options: ["/etc", "/var", "/usr/bin", "/opt"]
    explanation: |
      ב-`/etc` נמצאות ההגדרות של השרת, למשל `/etc/ssh/sshd_config`, `/etc/fstab` ו-`/etc/hosts`.
      ב-`/var` נמצא מידע שמשתנה כל הזמן, כמו לוגים. ב-`/usr/bin` נמצאות התוכנות. ב-`/opt` מתקינים תוכנות נוספות.

  linux-fhs-002:
    prompt: אפליקציה כותבת לוגים בלי הפסקה והדיסק מתמלא. איזו תיקייה הכי חשודה?
    options: ["/var/log", "/tmp", "/etc", "/boot"]
    explanation: |
      ב-`/var/log` נשמרים הלוגים. אם אין סבב לוגים (`logrotate`) או הגבלה ב-journald, הם גדלים עד שהדיסק מלא.
      `du -sh /var/log/*` מראה מה תופס הכי הרבה מקום.

  linux-fhs-003:
    prompt: מה ההבדל בין hard link ל-soft link (symbolic link)?
    keyPoints:
      - "hard link הוא עוד שם לאותו קובץ בדיוק (אותו inode, אותו מידע)"
      - "symlink הוא קובץ נפרד וקטן שמכיל נתיב לקובץ אחר"
      - "אם מוחקים את המקור, ה-symlink נשבר, אבל ה-hard link ממשיך לעבוד (המידע נמחק רק כשהשם האחרון נמחק)"
      - "hard link לא עובד בין דיסקים שונים ובדרך כלל לא לתיקיות; symlink כן"
    modelAnswer: |
      **hard link** הוא עוד שם לאותו קובץ. שני השמות מצביעים לאותו מידע בדיוק, והמידע נמחק רק כשמוחקים את השם האחרון. אי אפשר ליצור hard link לדיסק אחר או לתיקייה.
      **symlink** הוא קובץ קטן ונפרד שבתוכו כתוב נתיב לקובץ אחר. כמו קיצור דרך. אם מוחקים או מזיזים את המקור, הקיצור נשבר. symlink יכול להצביע לכל מקום, גם לתיקייה וגם לדיסק אחר.
      יוצרים אותם עם `ln` ועם `ln -s`.
    explanation: |
      `ls -li` מציג את מספר ה-inode. לשני hard links יש אותו מספר. ל-symlink יש מספר משלו, ורואים לידו חץ `->` ליעד.
    followUps: ["מה זה inode ומה נשמר בו?"]

  linux-fhs-004:
    prompt: צרו symbolic link בשם `current` שמצביע לתיקייה `releases/v2`.
    explanation: |
      הצורה היא `ln -s יעד שם_הקיצור`, כלומר היעד קודם.
      `-f` מחליף קיצור קיים. `-n` חשוב כשמחליפים קיצור שמצביע לתיקייה, למשל כשמעבירים את `current` לגרסה חדשה בפריסה.

  linux-fhs-005:
    prompt: מצאו את כל הקבצים שגדולים מ-100 MB תחת `/var`.
    explanation: |
      `-size +100M` אומר "יותר מ-100 מגה". `-type f` מחפש רק קבצים רגילים, ו-`-xdev` נשאר באותו דיסק.
      כדי לראות גם את הגודל: `find /var -type f -size +100M -exec ls -lh {} +`.

  linux-fhs-006:
    prompt: הציגו את הנתיב המלא של התיקייה שבה אתם נמצאים עכשיו.
    explanation: "`pwd` = print working directory. `cd -` חוזר לתיקייה הקודמת, ו-`cd ~` (או סתם `cd`) חוזר לתיקיית הבית."

  linux-fhs-007:
    prompt: מה `ls -la` מציג ש-`ls` רגיל לא מציג?
    options:
      - "קבצים מוסתרים (שמתחילים בנקודה), ופרטים: הרשאות, בעלים, גודל ותאריך"
      - "רק תיקיות"
      - "קבצים ממוינים לפי גודל"
      - "את התוכן של כל קובץ"
    explanation: "`-l` הוא תצוגה מפורטת, ו-`-a` כולל קבצים מוסתרים כמו `.env` ו-`.ssh`. עם `-h` הגדלים מוצגים בצורה קריאה."

  linux-fhs-008:
    prompt: הציגו את 50 השורות האחרונות של `/var/log/syslog`.
    explanation: "`tail` מציג את סוף הקובץ ו-`head` את ההתחלה. `tail -f` ממשיך להציג שורות חדשות. `less` מאפשר לגלול ולחפש."

  linux-perm-001:
    prompt: הסבירו מה עושה `chmod 754 script.sh`.
    keyPoints:
      - "שלוש הספרות הן: בעלים (owner), קבוצה (group), וכל השאר (others)"
      - "כל ספרה היא סכום: קריאה = 4, כתיבה = 2, הרצה = 1"
      - "לבעלים rwx (7), לקבוצה r-x (5), לשאר r-- (4)"
    modelAnswer: |
      שלוש הספרות קובעות הרשאות לשלושה סוגי משתמשים: הבעלים של הקובץ, הקבוצה שלו, וכל השאר.
      כל ספרה היא סכום: קריאה = 4, כתיבה = 2, הרצה = 1.
      7 = 4+2+1: הבעלים יכול לקרוא, לכתוב ולהריץ.
      5 = 4+1: הקבוצה יכולה לקרוא ולהריץ, בלי לכתוב.
      4: כל השאר יכולים רק לקרוא.
      `ls -l` יציג `-rwxr-xr--`.
    explanation: 'בכל ספרה מחברים: r=4, w=2, x=1. לכל אחד משלושת הסוגים יש ספרה משלו.'
    followUps: ["מה המשמעות של הרשאת הרצה על תיקייה?"]

  linux-perm-002:
    prompt: מה המשמעות של הרשאת הרצה (`x`) על **תיקייה**?
    options:
      - "אפשר להיכנס אליה (`cd`) ולגשת לקבצים שבתוכה לפי שם"
      - "אפשר לראות את רשימת הקבצים שבה"
      - "אפשר להריץ כל סקריפט שבתוכה"
      - "אפשר ליצור בה קבצים"
    explanation: |
      בתיקייה: `r` = לראות את שמות הקבצים, `w` = ליצור, למחוק ולשנות שמות, `x` = להיכנס לתיקייה ולגשת לקובץ לפי שם.
      בלי `x`, הפקודה `cd` תיכשל גם אם יש `r`.

  linux-perm-003:
    prompt: מה זה SUID ומה זה sticky bit? תנו דוגמה אמיתית לכל אחד.
    keyPoints:
      - "SUID על תוכנית: היא רצה עם ההרשאות של הבעלים שלה (בדרך כלל root), לא של מי שהריץ"
      - "דוגמה: /usr/bin/passwd מוגדר SUID root, כדי שמשתמש רגיל יוכל לעדכן את /etc/shadow"
      - "sticky bit על תיקייה: רק הבעלים של קובץ (או root) יכולים למחוק אותו, גם אם לכולם מותר לכתוב בתיקייה"
      - "דוגמה: /tmp (drwxrwxrwt)"
      - "תוכניות SUID הן סיכון אבטחה, ולכן צריך כמה שפחות מהן"
    modelAnswer: |
      **SUID** על תוכנית גורם לה לרוץ עם ההרשאות של הבעלים שלה, לא של מי שהריץ אותה. למשל `passwd` שייך ל-root ומוגדר SUID, ולכן משתמש רגיל יכול לשנות דרכו את הסיסמה שלו בקובץ `/etc/shadow`. רואים את זה כ-`s` במקום ה-`x` של הבעלים.
      **sticky bit** על תיקייה אומר: גם אם כולם יכולים לכתוב בה, רק הבעלים של קובץ (או root) יכול למחוק אותו או לשנות לו שם. הדוגמה הקלאסית היא `/tmp`, שמופיעה כ-`drwxrwxrwt` (ה-`t` בסוף).
      תוכניות SUID הן יעד מוכר להשגת הרשאות root, ולכן בודקים מדי פעם אילו יש במערכת.
    explanation: "ביטים מיוחדים: SUID=4000, SGID=2000, sticky=1000, למשל `chmod 1777 /tmp`. מוצאים תוכניות SUID עם `find / -perm -4000 -type f`."

  linux-perm-004:
    prompt: הגדירו שהבעלים של `/srv/app` ושל כל מה שבתוכה יהיה המשתמש `deploy`, והקבוצה `www-data`.
    explanation: "`chown user:group path`, ו-`-R` עובר על כל מה שבפנים. `chgrp` משנה רק את הקבוצה."

  linux-perm-005:
    prompt: עם umask של `022`, אילו הרשאות יקבל קובץ רגיל חדש?
    options: ["644 (rw-r--r--)", "755 (rwxr-xr-x)", "022", "600 (rw-------)"]
    explanation: |
      קבצים מתחילים מ-666 ותיקיות מ-777, ואז מורידים את מה שכתוב ב-umask.
      666 − 022 = 644 לקבצים, ו-777 − 022 = 755 לתיקיות. קובץ חדש אף פעם לא מקבל הרשאת הרצה אוטומטית.

  linux-perm-006:
    prompt: הפכו את הסקריפט `deploy.sh` לקובץ שאפשר להריץ (לפחות לבעלים).
    explanation: "בלי הרשאת הרצה, `./deploy.sh` ייכשל עם 'Permission denied'. `chmod +x` מוסיף אותה לכולם, ו-`u+x` רק לבעלים."

  linux-users-001:
    prompt: באיזה קובץ נשמרים ה-**hashes** של הסיסמאות ב-Linux מודרני?
    options: ["/etc/shadow", "/etc/passwd", "/etc/group", "/etc/sudoers"]
    explanation: |
      כל אחד יכול לקרוא את `/etc/passwd`. יש בו שם משתמש, UID, GID, תיקיית בית ו-shell, ובמקום הסיסמה רק `x`.
      ה-hashes נמצאים ב-`/etc/shadow`, שרק root יכול לקרוא.

  linux-users-002:
    prompt: הוסיפו את המשתמשת הקיימת `dana` לקבוצה `docker`, בלי להוציא אותה מהקבוצות האחרות שלה.
    explanation: |
      `-G` קובע את רשימת הקבוצות, ו**בלי `-a` הוא מחליף את כולן**. זו טעות קלאסית.
      השינוי נכנס לתוקף רק בהתחברות הבאה (או עם `newgrp docker`).

  linux-users-003:
    prompt: מה ההבדל בין `su` ל-`sudo`? למה חברות מעדיפות `sudo`?
    keyPoints:
      - "su מחליף למשתמש אחר (בדרך כלל root) ודורש את הסיסמה של המשתמש ההוא"
      - "sudo מריץ פקודה אחת כמשתמש אחר עם הסיסמה שלך, לפי כללים בקובץ /etc/sudoers"
      - "sudo מאפשר לקבוע בדיוק מי מורשה להריץ אילו פקודות"
      - "sudo רושם כל פקודה, ואף אחד לא צריך לדעת את סיסמת ה-root"
    modelAnswer: |
      `su` מעביר אתכם למשתמש אחר, בדרך כלל root, ושואל את הסיסמה של אותו משתמש.
      `sudo` מריץ פקודה אחת כמשתמש אחר, אחרי שהוא בודק בקובץ `/etc/sudoers` שמותר לכם. הוא שואל את הסיסמה שלכם.
      חברות מעדיפות sudo משלוש סיבות: אף אחד לא צריך לדעת את סיסמת ה-root, אפשר להרשות פקודות מסוימות לאנשים מסוימים, וכל פקודה נרשמת, כך שאפשר לדעת מי עשה מה.
      עורכים את הכללים עם `visudo`, שבודק שאין שגיאות.
    explanation: 'הרשאות מינימליות ואחריות אישית. כשבאמת צריך shell של root: `sudo -i`.'

  linux-users-004:
    prompt: הציגו איזה משתמש אתם ולאילו קבוצות אתם שייכים.
    explanation: "`id` מציג את ה-UID, את הקבוצה הראשית ואת כל הקבוצות. `whoami` מציג רק את השם."

  linux-proc-001:
    prompt: מה ההבדל בין process (תהליך) ל-thread?
    keyPoints:
      - "תהליך הוא תוכנית שרצה, עם זיכרון ומשאבים משלה, מבודדת מתהליכים אחרים"
      - "threads רצים בתוך תהליך וחולקים את הזיכרון והמשאבים שלו"
      - "thread זול יותר ליצירה, אבל באג ב-thread אחד יכול להפיל את כל התהליך; תהליכים מבודדים זה מזה"
      - "לכל תהליך יש PID; ה-threads חולקים אותו PID (ולכל אחד יש TID משלו)"
    modelAnswer: |
      **תהליך** הוא תוכנית שרצה כרגע, עם זיכרון משלה, קבצים פתוחים משלה ומספר מזהה (PID). מערכת ההפעלה מבודדת תהליכים זה מזה.
      **thread** הוא "מסלול ריצה" בתוך תהליך. לתהליך אחד יכולים להיות הרבה threads. הם חולקים את הזיכרון ואת הקבצים של התהליך, אבל לכל אחד יש מחסנית משלו.
      threads קלים ליצירה ומתקשרים דרך הזיכרון המשותף. זה מהיר, אבל צריך נעילות. תהליכים כבדים יותר, אבל מבודדים: אם אחד קורס, הוא לא מפיל את האחרים.
    explanation: "ב-Linux שניהם נוצרים עם `clone()`, וההבדל הוא כמה הם חולקים. `ps -eLf` או `top -H` מציגים threads."

  linux-proc-002:
    prompt: מה ההבדל בין `kill -15` ל-`kill -9`? מה לנסות קודם, ולמה?
    keyPoints:
      - "-15 הוא SIGTERM: מבקש מהתהליך לסיים; הוא יכול לתפוס את הבקשה ולסיים בצורה מסודרת"
      - "-9 הוא SIGKILL: הקרנל הורג את התהליך מיד; אי אפשר לתפוס או להתעלם"
      - "קודם SIGTERM, כדי שהתהליך יסגור קבצים וחיבורים וישמור מידע; SIGKILL רק אם הוא לא מגיב"
      - "Kubernetes ו-Docker שולחים SIGTERM, ואחרי זמן המתנה SIGKILL"
    modelAnswer: |
      `kill -15` שולח **SIGTERM**: בקשה מנומסת לסיים. התוכנית יכולה לתפוס אותה, לסיים את מה שהיא באמצע, לסגור חיבורים ולשמור מידע.
      `kill -9` שולח **SIGKILL**: הקרנל עוצר את התהליך מיד. אי אפשר לתפוס את זה, ולכן אין ניקוי, ויש סיכון למידע פגום.
      תמיד מתחילים ב-SIGTERM ומחכים כמה שניות. SIGKILL רק אם התהליך לא מת.
      Docker ו-Kubernetes עושים בדיוק את זה: SIGTERM, ואחרי זמן ההמתנה SIGKILL.
    explanation: "`kill` בלי מספר שולח SIGTERM. תהליך שתקוע בהמתנה לדיסק (מצב D) לא ימות אפילו עם -9, עד שהדיסק יחזיר תשובה."
    followUps: ["מה זה zombie process ואיך נפטרים ממנו?"]

  linux-proc-003:
    prompt: מה זה zombie process? איך נפטרים ממנו?
    keyPoints:
      - "תהליך שכבר הסתיים, אבל תהליך האב עוד לא אסף את קוד היציאה שלו (wait())"
      - "הוא לא צורך CPU או זיכרון, רק שורה בטבלת התהליכים; מופיע כ-Z או <defunct>"
      - "אי אפשר להרוג zombie; מתקנים את תהליך האב או שולחים לו סיגנל, או הורגים אותו, ואז PID 1 (systemd) מאמץ את ה-zombie ומנקה אותו"
      - "הרבה zombies מעידים על באג בתהליך האב, ויכולים לגמור את מספרי ה-PID"
    modelAnswer: |
      zombie הוא תהליך שכבר הסתיים, אבל תהליך האב שלו עוד לא קרא ל-`wait()` כדי לקבל את קוד היציאה. לכן הוא נשאר בטבלת התהליכים כ-`<defunct>`, במצב Z.
      הוא לא צורך CPU ולא זיכרון, רק מספר PID.
      אי אפשר להרוג zombie, כי הוא כבר מת. צריך לגרום לתהליך האב לאסוף אותו (לשלוח לו SIGCHLD או לתקן את הבאג), או להרוג את תהליך האב. אז ה-zombie עובר ל-PID 1, והוא מנקה אותו.
      כמה zombies לא מזיקים, אבל אלפים יכולים לגמור את מספרי ה-PID. בקונטיינרים זו הסיבה להשתמש בתהליך init אמיתי כמו `tini`.
    explanation: "`ps -eo pid,ppid,stat,cmd | grep -w Z` מציג zombies, כולל ה-PID של תהליך האב."

  linux-proc-004:
    prompt: הציגו את כל התהליכים במערכת, עם המשתמש, ה-PID, צריכת ה-CPU והזיכרון (בסגנון BSD).
    explanation: "`ps aux` (סגנון BSD) מציג USER, PID, %CPU, %MEM, STAT ו-COMMAND. `ps -ef` (סגנון System V) מציג UID, PID, PPID ו-CMD."

  linux-proc-005:
    prompt: איזה תהליך מאזין על פורט TCP 8080? הראו את זה בפקודה אחת.
    explanation: |
      `ss -tlnp` מציג חיבורי TCP (`-t`) שמאזינים (`-l`), עם מספרי פורטים (`-n`) והתהליך שמחזיק אותם (`-p`, צריך root כדי לראות תהליכים של משתמשים אחרים).
      גם `lsof -i :8080` עובד. `netstat` הוא הכלי הישן.

  linux-proc-006:
    prompt: הרצתם משימה ארוכה דרך SSH ואתם רוצים שתמשיך לרוץ אחרי שתתנתקו. מה עובד? (סמנו את כל הנכונות.)
    options: ["`nohup ./job.sh &`", "להריץ בתוך `tmux` או `screen`", "להריץ כשירות של systemd או עם `systemd-run`", "`./job.sh &` ואז לסגור את הטרמינל"]
    explanation: |
      כשה-SSH מתנתק, ה-shell שולח SIGHUP למשימות שלו, והן מתות.
      `nohup` מתעלם מ-SIGHUP. tmux ו-screen משאירים סשן חי על השרת. systemd מריץ את המשימה מחוץ לסשן שלכם.
      `&` רגיל בדרך כלל מת יחד עם הטרמינל (אלא אם מריצים `disown`).

  linux-proc-007:
    prompt: מה ההבדל בין הרצה של `./server &` להרצה של `./server` ב-shell?
    options:
      - "עם & הוא רץ ברקע והטרמינל חוזר אליכם; בלי זה הוא רץ בחזית ותופס את הטרמינל"
      - "& מריץ אותו עם הרשאות root"
      - "& מריץ אותו פעמיים"
      - "אין הבדל"
    explanation: "`jobs` מציג משימות ברקע, `fg` מחזיר משימה לחזית, Ctrl+Z עוצר את המשימה שבחזית, ו-`bg` ממשיך אותה ברקע."

  linux-perf-001:
    prompt: מה המשמעות של "load average" ב-Linux? בשרת עם 4 ליבות, load average של 6 זו בעיה?
    keyPoints:
      - "ממוצע של מספר התהליכים שרצים או מחכים לרוץ (כולל המתנה לדיסק, מצב D), על פני 1, 5 ו-15 דקות"
      - "חייבים להשוות אותו למספר הליבות"
      - "6 על 4 ליבות = יותר עבודה מליבות; תהליכים מחכים בתור (בערך 50% עומס יתר), ושווה לבדוק"
      - "load גבוה עם CPU נמוך אומר בדרך כלל המתנה לדיסק (I/O wait), לא בעיית CPU"
      - "לבדוק את המגמה (דקה מול 15 דקות) ולהמשיך עם top, vmstat, iostat"
    modelAnswer: |
      load average הוא הממוצע של כמה תהליכים רצים או מחכים לרוץ. ב-Linux זה כולל גם תהליכים שמחכים לדיסק.
      יש שלושה מספרים: ממוצע של דקה, של 5 דקות ושל 15 דקות.
      קוראים אותו ביחס למספר הליבות. ב-4 ליבות, load של 4 זה עומס מלא, ו-6 אומר שבערך שני תהליכים תמיד מחכים בתור. אז כן, שווה לבדוק.
      בודקים אם הוא עולה (הדקה האחרונה גבוהה מ-15 הדקות), ואז מריצים `top` או `vmstat`.
      אם ה-CPU כמעט פנוי אבל ה-load גבוה, זו בדרך כלל המתנה לדיסק (דיסק איטי או NFS), לא בעיית CPU.
    explanation: "`uptime` או `cat /proc/loadavg` מציגים אותו, ו-`nproc` את מספר הליבות. ב-`top`, הערך `wa` הוא המתנה לדיסק."
    followUps: ["מה הייתם בודקים אם ה-load גבוה אבל ה-CPU פנוי?"]

  linux-perf-002:
    prompt: '`free -h` מראה רק 200 MB בעמודה "free" אבל 5 GB ב-"available", בשרת עם 8 GB. מה זה אומר?'
    options:
      - "Linux משתמש בזיכרון הפנוי כ-cache לקבצים, ומשחרר אותו כשאפליקציה צריכה; השרת בסדר"
      - "לשרת עומד להיגמר הזיכרון"
      - "יש דליפת זיכרון בקרנל"
      - "ה-swap מלא"
    explanation: |
      זיכרון שלא בשימוש הוא זיכרון מבוזבז, ולכן Linux ממלא אותו ב-cache של הדיסק (buff/cache).
      העמודה **available** מעריכה כמה זיכרון אפליקציות יכולות לקבל בלי swap. זה המספר שצריך לעקוב אחריו. "free" נמוך לבדו הוא תקין.

  linux-perf-003:
    prompt: שרת Linux "איטי". תסבירו איך הייתם חוקרים את זה.
    keyPoints:
      - "קודם להבין את הסימפטום וההיקף: מה איטי, ממתי, שרת אחד או כולם, מה השתנה (פריסה?)"
      - "לבדוק load ו-CPU: uptime, top/htop (us, sy, wa, steal), ואיזה תהליך"
      - "לבדוק זיכרון ו-swap: free -h, תהליכים שנהרגו (OOM) ב-dmesg או ב-journal, ו-vmstat"
      - "לבדוק דיסק: df -h לדיסק מלא, iostat או iotop להמתנה ולעומס"
      - "לבדוק רשת: זמני תגובה, שגיאות, חיבורים (ss), DNS"
      - "לבדוק לוגים של האפליקציה ודשבורדים כדי למצוא קשר"
    modelAnswer: |
      קודם מבינים את הסימפטום: מה בדיוק איטי, ממתי, זה שרת אחד או הרבה, ומה השתנה, למשל פריסה.
      אחר כך עוברים על המשאבים, אחד-אחד:
      - **CPU:** `uptime` ו-`top`. האם העומס מהאפליקציה, מהקרנל, מהמתנה לדיסק או מ-steal? ואיזה תהליך עסוק?
      - **זיכרון:** `free -h` ו-`vmstat 1` לזיכרון ול-swap. `dmesg` או `journalctl -k` כדי לראות אם הקרנל הרג תהליכים (OOM).
      - **דיסק:** `df -h` לדיסק מלא, ו-`iostat -x 1` או `iotop` לדיסק עמוס.
      - **רשת:** `ss -s`, ובדיקת זמנים עם ping או curl.
      במקביל מסתכלים בלוגים של האפליקציה ובדשבורדים, כדי לראות מתי זה התחיל ועם מה זה קשור.
    explanation: זו שיטת USE (Utilization, Saturation, Errors) על CPU, זיכרון, דיסק ורשת. מראיינים רוצים לראות דרך מסודרת, לא רשימה אקראית של פקודות.

  linux-perf-004:
    prompt: סדרו את הצעדים הראשונים כששרת בפרודקשן נהיה איטי פתאום (ההגיוני ביותר קודם).
    steps:
      - "לוודא את הסימפטום ולבדוק מה השתנה לאחרונה (פריסות, תעבורה)"
      - "לבדוק load ו-CPU עם uptime / top"
      - "לבדוק זיכרון ו-swap עם free -h / vmstat"
      - "לבדוק מקום ועומס בדיסק עם df -h / iostat"
      - "להיכנס ללוגים ולמטריקות של התהליך הספציפי"
    explanation: מתחילים רחב (מה השתנה, איזה משאב עמוס) ומצמצמים עד לתהליך האשם. לקפוץ ישר לקובץ לוג אחד בדרך כלל מבזבז זמן.

  linux-perf-005:
    prompt: ב-`top`, בשורת ה-CPU, הערך `wa` הוא 60%. מה זה אומר?
    options:
      - "המעבדים פנויים ומחכים לדיסק או לרשת; כנראה האחסון הוא צוואר הבקבוק"
      - "60% מה-CPU בשימוש של אפליקציות"
      - "ה-hypervisor גונב זמן CPU"
      - "הקרנל עסוק בקריאות מערכת"
    explanation: "`wa` = המתנה לדיסק, `us` = אפליקציות, `sy` = הקרנל, `st` = steal (שרת וירטואלי עם שכן רועש). `wa` גבוה = דיסק איטי או עמוס. בודקים עם `iostat -x 1` או `iotop`."

  linux-perf-006:
    prompt: הציגו כמה זיכרון בשימוש וכמה זמין, ביחידות קריאות.
    explanation: "מסתכלים על העמודה 'available', לא על 'free'. Linux משתמש בזיכרון פנוי כ-cache לדיסק, ומשחרר אותו כשאפליקציה צריכה."

  linux-perf-007:
    prompt: תהליך מסוים צורך 100% CPU. איך מוצאים אותו ומה אפשר לעשות?
    keyPoints:
      - "מוצאים אותו עם top או htop (מיון לפי CPU) או ps aux --sort=-%cpu"
      - "מבינים מה זה ואם העומס צפוי (גיבוי לילי, עומס תעבורה) או באג (לולאה אינסופית)"
      - "מסתכלים על הלוגים שלו, על ה-threads (top -H) ועל מה שהוא עושה (strace, מטריקות של האפליקציה)"
      - "פועלים: מורידים עדיפות (renice), מגבילים (cgroups, limits), מפעילים מחדש בצורה מסודרת, מוסיפים שרתים, או מתקנים את הבאג"
    modelAnswer: |
      מריצים `top` (או `htop`) וממיינים לפי CPU, או `ps aux --sort=-%cpu | head`. כך רואים איזה תהליך זה ושל מי הוא.
      אחר כך שואלים: זה צפוי? גיבוי לילי או עומס תעבורה זה תקין. אפליקציית web שתקועה על 100% בלי תעבורה נשמעת כמו באג, למשל לולאה אינסופית.
      הלוגים והמטריקות שלו בדרך כלל מסבירים יותר, ו-`top -H` מראה איזה thread עסוק.
      ואז פועלים: אם זו משימת רקע שמפריעה לאחרים, מורידים לה עדיפות עם `renice` או מגבילים אותה. אם זה עומס אמיתי, מוסיפים שרתים. אם זה באג, מפעילים מחדש בצורה מסודרת כדי לחזור לעבוד, ודואגים שהבאג יתוקן.
    explanation: "בקונטיינרים, מגבלת CPU מאטה את התהליך במקום לתת לו לתפוס את כל השרת."

  linux-systemd-001:
    prompt: הציגו את 100 שורות הלוג האחרונות של השירות `nginx`, והמשיכו להציג שורות חדשות.
    explanation: "`-u` בוחר את השירות, `-n` את מספר השורות, ו-`-f` ממשיך לעקוב. עוד שימושי: `--since \"10 min ago\"`, `-p err` (רק שגיאות), `-b` (רק מאז ההפעלה האחרונה)."

  linux-systemd-002:
    prompt: מה ההבדל בין `systemctl enable` ל-`systemctl start`?
    keyPoints:
      - "start מפעיל את השירות עכשיו (רק עד ההפעלה מחדש הבאה של השרת)"
      - "enable גורם לשירות לעלות אוטומטית בכל הפעלה של השרת"
      - "הם נפרדים; enable --now עושה את שניהם"
    modelAnswer: |
      `systemctl start` מפעיל את השירות עכשיו, אבל אחרי הפעלה מחדש של השרת הוא לא יעלה.
      `systemctl enable` מגדיר שהשירות יעלה אוטומטית בכל הפעלה של השרת, אבל לא מפעיל אותו עכשיו.
      הם נפרדים. לשירות חדש בדרך כלל מריצים `systemctl enable --now myapp`, שעושה את שניהם.
    explanation: "`systemctl status`, `is-enabled` ו-`is-active` מציגים את המצב. אחרי שינוי בקובץ של שירות מריצים `systemctl daemon-reload`."

  linux-systemd-003:
    prompt: ערכתם את `/etc/systemd/system/myapp.service`. מה חייבים להריץ לפני שמפעילים אותו מחדש?
    options: ["systemctl daemon-reload", "systemctl reboot", "systemctl reset-failed", "systemctl enable myapp"]
    explanation: "systemd שומר את קובצי השירותים בזיכרון, ו-`daemon-reload` קורא אותם מחדש. אחר כך `systemctl restart myapp`."

  linux-systemd-004:
    prompt: בדקו אם השירות `nginx` רץ, וראו את שורות הלוג האחרונות שלו.
    explanation: "`status` מראה אם השירות פעיל, את ה-PID הראשי, את הזיכרון ואת שורות הלוג האחרונות. בשביל עוד לוגים: `journalctl -u nginx`."

  linux-disk-001:
    prompt: '`df -h` מראה שהדיסק מלא רק ב-60%, ובכל זאת מקבלים "No space left on device". מה יכול לגרום לזה?'
    keyPoints:
      - "נגמרו ה-inodes (הרבה קבצים קטנים); בודקים עם df -i"
      - "קובץ שנמחק עדיין פתוח אצל תהליך, ולכן המקום לא משתחרר; מוצאים עם lsof +L1 ומפעילים מחדש את התהליך"
      - "כותבים לדיסק או ל-mount אחר, מלא, ולא לזה שבדקתם (למשל /tmp או השכבה של קונטיינר)"
      - "מסביר מה זה inode (רשומה לכל קובץ; מספר קבוע בכל דיסק)"
    modelAnswer: |
      הסיבה הנפוצה ביותר: נגמרו ה-**inodes**. כל קובץ צורך inode אחד, והמספר נקבע כשיוצרים את הדיסק. מיליוני קבצים קטנים (cache, sessions, תור מיילים) יכולים לגמור אותם, גם כשיש עוד מקום. `df -i` מראה את זה. הפתרון: למחוק את הקבצים האלה.
      סיבה קלאסית נוספת: קובץ גדול נמחק, אבל תהליך עדיין מחזיק אותו פתוח. המקום לא משתחרר עד שהתהליך סוגר אותו. `lsof +L1` מוצא קבצים כאלה, והפעלה מחדש של התהליך משחררת את המקום.
      ולבסוף, לוודא שבודקים את הדיסק הנכון. ייתכן שהכתיבה הולכת לדיסק אחר שמלא.
    explanation: "ב-inode נשמרים פרטי הקובץ (בעלים, הרשאות, זמנים, איפה המידע), אבל לא השם. השמות נמצאים בתיקיות."
    followUps: ["איך הייתם מוצאים איזו תיקייה מכילה הכי הרבה קבצים?"]

  linux-disk-002:
    prompt: הציגו את הגודל של כל פריט ב-`/var/log`, בצורה קריאה, כדי לראות מה תופס מקום.
    explanation: "`du -sh dir/*` נותן סיכום לכל פריט. עם `| sort -h` הם ממוינים לפי גודל. `df` מציג מקום פנוי לכל דיסק, לא לכל תיקייה. `ncdu` הוא כלי אינטראקטיבי נוח."

  linux-disk-003:
    prompt: איזה קובץ קובע אילו דיסקים מחוברים (mount) אוטומטית כשהשרת עולה?
    options: ["/etc/fstab", "/etc/mtab", "/proc/mounts", "/etc/mounts.conf"]
    explanation: "`/etc/fstab` קובע מה מחובר בהפעלה. `/proc/mounts` (ו-`/etc/mtab`) מראים מה מחובר כרגע. בודקים שינויים ב-fstab עם `mount -a` לפני הפעלה מחדש, כי שגיאה שם יכולה למנוע מהשרת לעלות."

  linux-disk-004:
    prompt: הציגו את המקום הפנוי והתפוס בכל הדיסקים המחוברים, בצורה קריאה.
    explanation: "`df` עובד לפי דיסק, ו-`du` מודד תיקיות וקבצים. `df -i` מראה כמה inodes בשימוש."

  linux-pkg-001:
    prompt: איזה מנהל חבילות שייך לאיזו משפחת הפצות? בחרו את הזוג הנכון.
    options: ["apt/dpkg ל-Debian/Ubuntu; dnf/yum/rpm ל-RHEL/CentOS/Fedora", "apt ל-RHEL; yum ל-Ubuntu", "apk ל-Ubuntu; apt ל-Alpine", "pacman ל-Debian; dnf ל-Arch"]
    explanation: "ב-Debian וב-Ubuntu משתמשים ב-`apt` (מעל `dpkg`). ב-RHEL, Rocky ו-Fedora משתמשים ב-`dnf` או `yum` (מעל `rpm`). ב-Alpine, שנפוצה בקונטיינרים, משתמשים ב-`apk`."

  linux-pkg-002:
    prompt: ב-Ubuntu, רעננו את רשימת החבילות והתקינו את `curl` בלי שאלות.
    explanation: קודם מעדכנים את רשימת החבילות (ב-Dockerfile באותה שורת RUN), ו-`-y` מאשר את ההתקנה אוטומטית.

  linux-ssh-001:
    prompt: איך עובדת התחברות SSH עם מפתחות, ולמה זה עדיף על סיסמה?
    keyPoints:
      - "יוצרים זוג מפתחות; המפתח הפרטי נשאר אצלכם, והציבורי נכנס לקובץ ~/.ssh/authorized_keys בשרת"
      - "השרת בודק שהמפתח הפרטי אצלכם בעזרת חתימה; המפתח הפרטי אף פעם לא נשלח"
      - "עדיף: אי אפשר לנחש אותו, שום סוד לא עובר ברשת, אפשר להגן עליו עם סיסמה, וקל לבטל מפתח אחד"
      - "מומלץ לבטל בשרת התחברות עם סיסמה ושל root (בקובץ sshd_config)"
    modelAnswer: |
      יוצרים זוג מפתחות עם `ssh-keygen`.
      המפתח **הפרטי** נשאר על המחשב שלכם, רצוי מוגן בסיסמה. המפתח **הציבורי** נכנס לקובץ `~/.ssh/authorized_keys` בשרת, למשל עם `ssh-copy-id`.
      כשמתחברים, השרת שולח אתגר שרק מי שמחזיק את המפתח הפרטי יכול לחתום עליו, ובודק את החתימה עם המפתח הציבורי. המפתח הפרטי לא יוצא מהמחשב.
      זה הרבה יותר חזק מסיסמה: אין מה לנחש, אין מה לגנוב בפישינג, שום דבר שאפשר להשתמש בו שוב לא עובר ברשת, ואפשר לבטל מפתח של אדם אחד בלי להשפיע על אחרים.
      בשרתים מגדירים גם `PasswordAuthentication no` ו-`PermitRootLogin no`.
    explanation: "שגיאות הרשאות נפוצות: `~/.ssh` חייב להיות 700 ו-`authorized_keys` חייב להיות 600, אחרת השרת מתעלם מהם."
    followUps: ["מקבלים 'Permission denied (publickey)'. מה בודקים?"]

  linux-ssh-002:
    prompt: צרו זוג מפתחות SSH חדש מסוג Ed25519, עם ההערה `dana@laptop`.
    explanation: מפתחות Ed25519 קצרים, מהירים ובטוחים, והם ברירת המחדל המודרנית. `-f` בוחר את שם הקובץ.

  linux-ssh-003:
    prompt: אילו הגדרות ב-`sshd_config` מקשיחות שרת שחשוף לאינטרנט? (סמנו את כל הנכונות.)
    options: ["`PasswordAuthentication no`", "`PermitRootLogin no`", "`PermitEmptyPasswords yes`", "`AllowUsers deploy`"]
    explanation: |
      רק מפתחות, בלי התחברות ישירה של root, ורשימה של משתמשים מורשים. אפשר להוסיף fail2ban, או firewall שמגביל את פורט 22 לכתובות מוכרות או ל-VPN.
      אחרי השינוי מריצים `systemctl reload sshd`, ומשאירים את החיבור הנוכחי פתוח, למקרה שנעלתם את עצמכם בחוץ.

  linux-ssh-004:
    prompt: העתיקו את הקובץ המקומי `app.tar.gz` לתיקייה `/tmp` בשרת `10.0.1.5`, כמשתמש `deploy`.
    explanation: "`scp מקור יעד`. נתיב בשרת מרוחק כותבים `user@host:path`. `rsync` עדיף להעתקות גדולות או חוזרות, כי הוא שולח רק את מה שהשתנה."

  linux-boot-001:
    prompt: סדרו את תהליך העלייה (boot) של Linux.
    steps:
      - "ה-firmware (BIOS/UEFI) בודק את החומרה ומוצא ממה לעלות"
      - "ה-bootloader (GRUB) טוען את הקרנל ואת ה-initramfs"
      - "הקרנל מכין את החומרה ומחבר את מערכת הקבצים הראשית"
      - "PID 1 (systemd) עולה"
      - "systemd מפעיל את השירותים עד שהמערכת מוכנה"
    explanation: "firmware ← bootloader ← קרנל (+ initramfs) ← systemd (PID 1) ← שירותים ← התחברות. `systemd-analyze blame` מראה מה האט את העלייה."

  linux-boot-002:
    prompt: מה זה PID 1 ברוב ההפצות המודרניות של Linux, ולמה זה חשוב?
    options:
      - "systemd: התהליך הראשון, שמפעיל ומשגיח על כל השירותים ומאמץ תהליכים שנשארו בלי אב"
      - "הקרנל עצמו"
      - "bash, ה-shell הראשון"
      - "sshd, כדי שאפשר יהיה להתחבר"
    explanation: PID 1 הוא התהליך הראשון שעולה. הוא מפעיל את כל השאר, מנקה תהליכים יתומים ומטפל בסיגנלים בצורה מיוחדת. בקונטיינר, האפליקציה שלכם היא לרוב PID 1, ולכן הטיפול בסיגנלים ובניקוי zombies חשוב שם.

  linux-cron-001:
    prompt: "מה המשמעות של לוח הזמנים `*/15 2 * * 1-5` ב-cron?"
    options:
      - "כל 15 דקות במהלך השעה 02:00, בימים שני עד שישי"
      - "ב-02:15 כל יום"
      - "כל שעתיים, ברבע אחרי, בסופי שבוע"
      - "כל 15 שעות ב-2 לכל חודש"
    explanation: "השדות לפי הסדר: דקה, שעה, יום בחודש, חודש, יום בשבוע. `*/15` בשדה הדקה = 0, 15, 30, 45. שעה 2 = בין 02:00 ל-02:59. `1-5` = שני עד שישי (ב-cron, 0 הוא יום ראשון). האתר crontab.guru עוזר לבדוק."

  linux-cron-002:
    prompt: סקריפט עובד כשמריצים אותו ידנית, אבל נכשל כשהוא רץ מ-cron. מה הסיבות הנפוצות?
    keyPoints:
      - "cron רץ עם סביבה מינימלית: PATH שונה ומשתני סביבה חסרים; משתמשים בנתיבים מלאים או מגדירים PATH"
      - "תיקיית עבודה אחרת, ולכן נתיבים יחסיים נשברים"
      - "רץ כמשתמש אחר, עם הרשאות אחרות"
      - "לא רואים פלט: מפנים stdout ו-stderr לקובץ לוג (או בודקים ב-journal) כדי לדבג"
      - "חסר shebang או הרשאת הרצה, או תו % שצריך לסמן ב-crontab"
    modelAnswer: |
      cron מריץ משימות עם סביבה זעירה: PATH מינימלי, בלי ההגדרות של ה-shell שלכם, ולרוב בתיקייה אחרת ואולי כמשתמש אחר.
      לכן פקודות שנמצאות ב-shell הרגיל לא נמצאות, משתני סביבה חסרים, ונתיבים יחסיים נשברים.
      הפתרון: נתיבים מלאים לפקודות ולקבצים, להגדיר PATH או לטעון קובץ הגדרות בתחילת הסקריפט, ו-`cd` לתיקייה הנכונה.
      כדי לראות מה באמת קורה, מפנים את הפלט: `>> /var/log/myjob.log 2>&1`, ובודקים `grep CRON /var/log/syslog` או את ה-journal.
      בודקים גם את ה-shebang ואת הרשאת ההרצה, ומסמנים `%` בשורה של ה-crontab (`\%`).
    explanation: היום הרבה פעמים משתמשים במקום זה ב-systemd timer, שנותן לוגים ב-journald וניהול תלויות בחינם.
