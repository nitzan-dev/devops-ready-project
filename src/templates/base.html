<!doctype html>
<html lang="{{ lang }}" dir="{{ 'rtl' if lang == 'he' else 'ltr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t.title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="logo" href="{{ url_for('index') }}">$_ {{ t.title }}</a>
    <nav>
      <a href="{{ url_for('index') }}">{{ t.home }}</a>
      <a href="{{ url_for('review') }}">{{ t.review }}</a>
      <a href="{{ url_for('switch_language') }}">{{ t.switch }}</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
